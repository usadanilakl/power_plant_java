<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAES — animated logo</title>

<!-- ===== 1. FONT (put in your <head>) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,700;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ===== 2. CSS (put in your stylesheet) ===== -->
<style>
.na-logo{
  --na-scale:1;                 /* change this one number to resize */
  display:flex; align-items:center; gap:28px;
  font-family:'Space Grotesk',sans-serif;
  transform:scale(var(--na-scale)); transform-origin:left center;
}
.na-markwrap{position:relative;display:grid;place-items:center;width:160px;height:160px;flex:none}
.na-glow{position:absolute;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,32,60,.42),rgba(181,18,47,.12) 58%,transparent 72%);
  animation:na-glowpulse 3.6s ease-in-out infinite}
.na-mark{position:relative;transform-origin:50% 50%;animation:na-spin 11s linear infinite}
.na-arm{
  fill:#ac2c41; stroke:none;
  transform-box:view-box; transform-origin:60px 60px;
  animation:na-unfurl 1.15s cubic-bezier(.2,.75,.25,1) both;
}
.na-arm:nth-child(2){animation-delay:.1s}
.na-arm:nth-child(3){animation-delay:.2s}
.na-arm:nth-child(4){animation-delay:.3s}

.na-text{display:flex;flex-direction:column;gap:9px}
.na-word{display:flex;font-style:italic;font-weight:700;font-size:76px;letter-spacing:-3px}
.na-word span{
  padding:0 .2em; margin:0 -.2em;   /* let italic ink overhang the gradient box */
  background-image:linear-gradient(100deg,#e8ecf1 34%,#ff8195 46%,#c8203c 50%,#e8ecf1 62%);
  background-size:340% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:na-shine 3.6s linear infinite;
}
.na-word span:nth-child(2){animation-delay:.1s}
.na-word span:nth-child(3){animation-delay:.2s}
.na-word span:nth-child(4){animation-delay:.3s}

.na-rule{height:2px;width:100%;opacity:.85;background:linear-gradient(90deg,#c8203c,#6d1020,transparent)}
.na-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:4.5px;color:#9a7480;text-transform:uppercase}

@keyframes na-spin{to{transform:rotate(360deg)}}
@keyframes na-unfurl{
  from{transform:rotate(-70deg) scale(.55);opacity:0}
  to{transform:rotate(0) scale(1);opacity:1}
}
@keyframes na-glowpulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.8;transform:scale(1.1)}}
@keyframes na-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}

/* accessibility + print: hold a clean static frame */
@media (prefers-reduced-motion:reduce){
  .na-logo *{animation:none !important}
  .na-arm{transform:none;opacity:1}
  .na-word span{background:none;color:#e8ecf1}
}
@media print{
  .na-logo *{animation:none !important}
  .na-arm{transform:none;opacity:1}
}
</style>

<style>/* demo page only — not part of the logo */
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;padding:60px}</style>
</head>
