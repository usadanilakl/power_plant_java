<app-main-layout>
  <ng-container header>
    <app-router-menu [layout]="'row'"></app-router-menu>
  </ng-container>
  <ng-container main-content>
    <div class="backup-container">
      <h2>Database Backup and Restore</h2>

      <div class="create-backup">
        <h3>Create New Backup</h3>
        <input [(ngModel)]="newBackupName" placeholder="Backup name (optional)">
        <button (click)="createBackup()">Create Backup</button>
      </div>

      <div class="restore-backup">
        <h3>Restore Backup</h3>
        <select [(ngModel)]="selectedBackup">
          <option value="">Select a backup</option>
          <option *ngFor="let backup of backups" [value]="backup">{{backup}}</option>
        </select>
        <button (click)="restoreBackup()">Restore Selected Backup</button>
      </div>

      <div class="backup-list">
        <h3>Available Backups</h3>
        <ul>
          <li *ngFor="let backup of backups">{{backup}}</li>
        </ul>
      </div>

      <div class="restore-backup">
        <h3>Restore Backup (from shared drive)</h3>
        <select [(ngModel)]="selectedSharedBackup">
          <option value="">Select a backup</option>
          <option *ngFor="let backup of sharedDriveBackups" [value]="backup">{{backup}}</option>
        </select>
        <button (click)="restoreSharedBackup()">Restore Selected Backup</button>
      </div>

      <div class="backup-list">
        <h3>Available Backups (on shared drive)</h3>
        <ul>
          <li *ngFor="let backup of sharedDriveBackups">{{backup}}</li>
        </ul>
      </div>

      <div class="message" *ngIf="sharedDriveMessage">
        {{message}}
      </div>
    </div>
  </ng-container>
</app-main-layout>
