<app-main-layout [isSideMenuEnabled]="!isPopupMode() && hasLeftMenu()">
  @if (!isPopupMode()) {
    <ng-container header>
      <app-router-menu [layout]="'row'"></app-router-menu>
    </ng-container>
  }
  @if (!isPopupMode() && hasLeftMenu()) {
    <ng-container left-menu>
      <app-left-menu-outlet></app-left-menu-outlet>
    </ng-container>
  }
  <ng-container main-content>
    <router-outlet></router-outlet>
  </ng-container>
</app-main-layout>
