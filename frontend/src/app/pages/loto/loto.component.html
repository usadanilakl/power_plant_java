<app-main-layout>
  <ng-container header>
    <div class="header-menus">
      <div class="menu-container">
        <app-router-menu [layout]="'row'"></app-router-menu>
      </div>
      <div class="menu-container">
        <app-router-menu [menuItems]="lotoNavMenuItems" [layout]="'row'"></app-router-menu>
      </div>
    </div>
  </ng-container>
  <ng-container left-menu>
    @if(currentRoute === 'loto-standard'){
      <app-loto-standard-side-menu></app-loto-standard-side-menu>
    }@else if(currentRoute === 'loto'){
      <app-loto-side-menu></app-loto-side-menu>
    }
     <!-- <app-left-menu-outlet></app-left-menu-outlet> -->
  </ng-container>
  <ng-container main-content>
    <router-outlet></router-outlet>
  </ng-container>
  <ng-container bottom-menu>
    <!-- <app-bottom-menu-outlet></app-bottom-menu-outlet> -->
    @if(currentRoute === 'loto-standard'){
      <!-- <app-loto-standard-side-menu></app-loto-standard-side-menu> -->
    }@else if(currentRoute === 'loto'){
      <!-- <app-loto-table></app-loto-table> -->
    }
  </ng-container>
