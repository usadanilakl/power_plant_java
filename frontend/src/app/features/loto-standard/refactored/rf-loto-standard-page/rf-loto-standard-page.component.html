<app-main-layout
  [isBottomMenuEnabled]="true"
  [isSideMenuEnabled]="true"
>
  <ng-container header>
    <app-router-menu [layout]="'row'"></app-router-menu>
  </ng-container>
  <ng-container left-menu>
    <app-rf-loto-standard-left-panel></app-rf-loto-standard-left-panel>
  </ng-container>
  <ng-container main-content>
    @if (stateService.selectedItem()) {
      <app-rf-loto-standard-form [fieldsInput]="stateService.formFields()"></app-rf-loto-standard-form>
    } @else {
      <div class="empty-state">
        <div class="empty-state-content">
          <span class="empty-state-icon">📋</span>
          <p>Select a LOTO Standard from the left panel to view details</p>
        </div>
      </div>
    }
  </ng-container>
  <ng-container bottom-menu>
    <!-- <app-bottom-menu-outlet></app-bottom-menu-outlet> -->
  </ng-container>
</app-main-layout>

<!-- LOTO Point Form Popup -->
<app-rf-popup-projection
  [isOpen]="lotoPointStateService.isLotoPointFormOpen()"
  [fullHeight]="true"
  (close)="lotoPointStateService.closeForm()"
>
  <app-rf-loto-point-form [fieldsInput]="lotoPointStateService.formFields()"></app-rf-loto-point-form>
</app-rf-popup-projection>

<!-- File Form Popup -->
<app-rf-popup-projection
  [isOpen]="fileStateService.isFileFormOpen()"
  [fullHeight]="true"
  (close)="fileStateService.closeForm()"
>
  <app-rf-file-form></app-rf-file-form>
</app-rf-popup-projection>

<!-- Export Dialog -->
<app-export-dialog></app-export-dialog>

<!-- Counterpart Standard Dialog -->
@if (contextMenuService.counterpartDialogSourceId()) {
  <app-counterpart-standard-dialog
    [sourceStandardId]="contextMenuService.counterpartDialogSourceId()!"
    (standardCreated)="onCounterpartCreated($event)"
    (dialogClosed)="contextMenuService.counterpartDialogSourceId.set(null)"
  ></app-counterpart-standard-dialog>
}
