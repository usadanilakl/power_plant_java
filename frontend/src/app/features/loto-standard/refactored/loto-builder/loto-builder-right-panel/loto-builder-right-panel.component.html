<div class="right-panel-container">
  <!-- Processing Overlay -->
  @if (builderState.isProcessingShape()) {
    <div class="processing-overlay">
      <div class="processing-content">
        <div class="processing-spinner"></div>
        <span class="processing-message">{{ builderState.processingMessage() }}</span>
      </div>
    </div>
  }

  <!-- Image Viewer Area -->
  <div class="image-area">
    @if (currentImageUrl()) {
      <app-interactive-image
        [imageUrl]="currentImageUrl()"
        [shapesInput]="currentShapes()"
        [hoveredShapeId]="hoveredShapeId()"
        [config]="imageConfig()"
        [customContextMenuActions]="customContextMenuActions()"
        (shapeHovered)="onShapeHovered($event)"
        (shapeClicked)="onShapeClicked($event)"
        (shapeDoubleClicked)="onShapeDoubleClicked($event)"
        (shapeRightClicked)="onShapeRightClicked($event)"
        (shapeUpdated)="onShapeUpdated($event)"
        (shapeDrawn)="onShapeDrawn($event)"
      ></app-interactive-image>

      <!-- Info Window (positioned in upper right) -->
      <app-loto-builder-info-window></app-loto-builder-info-window>
    } @else {
      <div class="empty-state">
        <div class="empty-icon">🖼️</div>
        <p class="empty-title">No File Selected</p>
        <p class="empty-message">
          Select a file from the left panel to start building LOTO points
        </p>
      </div>
    }
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button
      class="toolbar-button"
      [class.active]="builderState.isTextRecognitionEnabled()"
      title="Toggle Text Recognition - When enabled, OCR will recognize text from drawn shapes"
      (click)="builderState.toggleTextRecognition()"
    >
      {{ builderState.isTextRecognitionEnabled() ? 'OCR On' : 'OCR Off' }}
    </button>
    <button
      class="toolbar-button"
      title="Show LOTO Points"
      (click)="builderState.toggleLotoPointTable()"
    >
      LOTO Points
    </button>
    <button
      class="toolbar-button"
      [class.active]="builderState.isCarouselVisible()"
      title="Toggle LOTO Building Mode"
      (click)="builderState.toggleCarousel()"
    >
      Build LOTO ({{ builderState.selectedLotoStandards().length }})
    </button>
    <button
      class="toolbar-button"
      title="Select LOTO Standards"
      (click)="builderState.openLotoStandardsPopup()"
    >
      Select Standards
    </button>
    <button
      class="toolbar-button primary"
      title="Save Changes"
      [disabled]="!builderState.hasUnsavedChanges()"
      (click)="onSave()"
    >
      Save
    </button>
    <button
      class="toolbar-button"
      title="Close Builder"
      (click)="onClose()"
    >
      Close
    </button>
  </div>
</div>
