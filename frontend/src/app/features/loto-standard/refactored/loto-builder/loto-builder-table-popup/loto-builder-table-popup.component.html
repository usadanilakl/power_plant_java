@if (isVisible()) {
  <app-rf-floating-window
    [windowId]="windowId"
    [initialPosition]="initialPosition"
    [initialSize]="initialSize"
    [minSize]="minSize"
  >
    <!-- Header content -->
    <div window-header class="header-content">
      <div class="header-title">
        <span class="drag-handle" title="Drag to move">&#8942;&#8942;</span>
        <h2>LOTO Points</h2>
        <span class="table-info">
          {{ lotoPoints().length }} point{{ lotoPoints().length !== 1 ? 's' : '' }}
        </span>
      </div>
      <button class="close-button" (click)="close()" title="Close">
        &#10005;
      </button>
    </div>

    <!-- Table content -->
    <div class="table-content">
      <app-loto-point-display-table
        [inputItems]="lotoPoints()"
        [isTableIsolated]="true"
        [loadMoreEnabled]="false"
        [hoverDebounceTime]="100"
        [hoveredItemId]="hoveredLotoPoint()?.id ?? null"
        [scrollToItemId]="scrollToLotoPointId()"
        (selectedItemsEvent)="onRowSelected($event)"
        (rowHoveredEvent)="onRowHovered($event)"
      ></app-loto-point-display-table>
    </div>

    <!-- Footer -->
    <div window-footer class="table-footer">
      <button class="action-button" (click)="close()">
        Close
      </button>
    </div>
  </app-rf-floating-window>
}
