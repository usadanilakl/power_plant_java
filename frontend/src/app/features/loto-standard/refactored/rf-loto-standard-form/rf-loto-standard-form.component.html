<!-- Draft Comparison Dialog (future implementation) -->
@if (showDraftDialog() && serverEntity() && draftEntity()) {
  <div class="draft-dialog">
    <h3>Draft detected</h3>
    <p>A draft was saved at {{ draftTimestamp() }}</p>
    <button (click)="onUseDraft()">Use Draft</button>
    <button (click)="onUseServer()">Use Server Version</button>
    <button (click)="onCancelDraftDialog()">Cancel</button>
  </div>
}

<div class="form-container">
  <!-- Standard Fields Form -->
  <app-rf-reactive-form
    [entity]="entity()"
    [fields]="fields()"
    [title]="'LOTO Standard Form'"
    (formValueChange)="onAnyValueChange($event)"
    (formSubmit)="onSubmit($event)"
  >
    <ng-container extra-buttons>
      <!-- Future: Add clipboard functionality for standards -->
    </ng-container>
  </app-rf-reactive-form>

  <!-- Double LOTO Point Table for managing loto points -->
  <div class="loto-points-section">
    <h3>LOTO Points</h3>
    <app-double-loto-point-table
      [selectedItems]="selectedLotoPoints()"
    ></app-double-loto-point-table>
  </div>

  <!-- File Viewer - displays aggregated files from loto standard -->
  @if (entity().id) {
    <div class="file-viewer-section">
      <h3>Related Files from LOTO Points</h3>
      <!-- File viewer will fetch files from backend based on lotoStandardId -->
      <p class="info-text">File viewer to be implemented - will show aggregated images from all LOTO points in this standard</p>
    </div>
  }
</div>
