<!-- Draft Comparison Dialog (future implementation) -->
@if (showDraftDialog() && serverEntity() && draftEntity()) {
  <div class="draft-dialog">
    <h3>Draft detected</h3>
    <p>A draft was saved at {{ draftTimestamp() }}</p>
    <button (click)="onUseDraft()">Use Draft</button>
    <button (click)="onUseServer()">Use Server Version</button>
    <button (click)="onCancelDraftDialog()">Cancel</button>
  </div>
}

<div class="form-container">
  <!-- Carousel Navigation -->
  <div class="carousel-nav">
    <button
      class="nav-btn"
      [class.active]="currentSlide() === 0"
      (click)="goToSlide(0)"
    >
      <span class="nav-icon">📝</span>
      <span class="nav-label">General Info</span>
    </button>
    <button
      class="nav-btn"
      [class.active]="currentSlide() === 1"
      (click)="goToSlide(1)"
    >
      <span class="nav-icon">📋</span>
      <span class="nav-label">LOTO Points</span>
    </button>
    <button
      class="nav-btn"
      [class.active]="currentSlide() === 2"
      (click)="goToSlide(2)"
      [disabled]="!entity().id"
    >
      <span class="nav-icon">🖼️</span>
      <span class="nav-label">Images</span>
    </button>
  </div>

  <!-- Carousel Container -->
  <div class="carousel-container">
    <div class="carousel-track" [style.margin-left]="'-' + (currentSlide() * 100) + '%'">

      <!-- Slide 1: Standard Fields Form -->
      <div class="carousel-slide">
        <div class="slide-content">
          <app-rf-reactive-form
            [entity]="entity()"
            [fields]="fields()"
            [title]="'LOTO Standard Form'"
            (formValueChange)="onAnyValueChange($event)"
            (formSubmit)="onSubmit($event)"
          >
            <ng-container extra-buttons>
              @if (entity().id) {
                <button type="button" class="counterpart-btn" (click)="openCounterpartDialog()">Generate Counterpart</button>
              }
            </ng-container>
          </app-rf-reactive-form>
        </div>
      </div>

      <!-- Slide 2: Double LOTO Point Table -->
      <div class="carousel-slide">
        <div class="slide-content loto-points-section">
          <h3>LOTO Points</h3>
          <app-double-loto-point-table
            [selectedItems]="selectedLotoPoints()"
            (itemAdded)="onLotoPointAdded($event)"
            (itemRemoved)="onLotoPointRemoved($event)"
            (itemsReordered)="onLotoPointsReordered($event)"
          ></app-double-loto-point-table>
        </div>
      </div>

      <!-- Slide 3: Image Viewer -->
      <div class="carousel-slide">
        <div class="slide-content file-viewer-section">
          @if (entity().id) {
            <app-loto-standard-image-viewer
              [lotoStandard]="entity()"
            ></app-loto-standard-image-viewer>
          } @else {
            <div class="empty-state">
              <p>Save the LOTO Standard first to view related images</p>
            </div>
          }
        </div>
      </div>

    </div>
  </div>

  <!-- Carousel Arrow Controls -->
  <button
    class="carousel-arrow carousel-arrow-left"
    (click)="previousSlide()"
    [disabled]="currentSlide() === 0"
  >
    ‹
  </button>
  <button
    class="carousel-arrow carousel-arrow-right"
    (click)="nextSlide()"
    [disabled]="currentSlide() === 2 || (currentSlide() === 1 && !entity().id)"
  >
    ›
  </button>
</div>

<!-- Counterpart Standard Dialog -->
@if (showCounterpartDialog() && entity().id) {
  <app-counterpart-standard-dialog
    [sourceStandardId]="entity().id!"
    (standardCreated)="onCounterpartCreated($event)"
    (dialogClosed)="showCounterpartDialog.set(false)"
  ></app-counterpart-standard-dialog>
}
