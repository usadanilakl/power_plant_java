<div class="form-container">
    @if(isFormReady()){
        <app-reactive-form
            [fields]="fields()"
            [layout]="'column'"
            [values]="values()"
            [title]="'Safe Work'"
            (formValueChange)="valuesChange.emit($event)"
            (formSubmit)="onFormSubmit($event)"
            (formDelete)="onFormDelete()"
        ></app-reactive-form>

    }@else {
        <p>Loading form...</p>
    }
</div>
