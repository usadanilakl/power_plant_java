<div class="permit-menu-container">
  <div class="menu-header">
    <h2>Daily Packages</h2>
    <div class="header-actions">
      <button class="icon-button refresh-button" (click)="refresh()" [disabled]="isLoading()" title="Refresh">
        <span class="icon">&#8635;</span>
      </button>
    </div>
  </div>

  <div class="grouping-controls">
    <label class="controls-label">Group by:</label>
    <div class="grouping-buttons">
      <button
        class="group-button"
        [class.active]="groupBy() === 'company'"
        (click)="setGrouping('company')"
      >Company</button>
      <button
        class="group-button"
        [class.active]="groupBy() === 'person'"
        (click)="setGrouping('person')"
      >Person</button>
      <button
        class="group-button"
        [class.active]="groupBy() === 'date'"
        (click)="setGrouping('date')"
      >Date</button>
      <button
        class="group-button"
        [class.active]="groupBy() === 'status'"
        (click)="setGrouping('status')"
      >Status</button>
    </div>
  </div>

  @if (isLoading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <span>Loading packages...</span>
    </div>
  } @else {
    <app-rf-toggle-menu
      [menuItems]="menuItems()"
      [enableSearch]="true"
      [searchPlaceholder]="'Search daily packages...'"
      (itemClick)="onItemClick($event)"
    ></app-rf-toggle-menu>
  }
</div>
