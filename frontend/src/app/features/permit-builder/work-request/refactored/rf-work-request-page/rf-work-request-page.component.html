<div class="work-request-page">
  <div class="page-toolbar">
    <button class="action-btn new-btn" (click)="onNewWorkRequest()">+ New</button>
  </div>

  <app-sp-sync-toolbar
    entityType="WorkRequest"
    (syncComplete)="onSyncComplete()"
  ></app-sp-sync-toolbar>

  <app-rf-work-request-table
    (selectedItemsEvent)="onSelectedItems($event)"
    (rowDoubleClickedEvent)="onRowDoubleClicked($event)"
  ></app-rf-work-request-table>
</div>

<app-export-dialog></app-export-dialog>

<!-- Work Request Form Popup -->
<app-rf-popup-projection
  [isOpen]="stateService.isFormOpen()"
  [fullHeight]="true"
  (close)="stateService.closeForm()"
>
  <app-rf-work-request-form [fieldsInput]="stateService.formFields()"></app-rf-work-request-form>
</app-rf-popup-projection>
