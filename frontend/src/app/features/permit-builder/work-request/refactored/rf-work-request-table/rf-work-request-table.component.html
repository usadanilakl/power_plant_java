<div class="work-request-table-container">
  @if (errorMessage()) {
    <div class="error-message">
      {{ errorMessage() }}
    </div>
  }

  @if (isLoading()) {
    <div class="loading-indicator">
      Loading work requests...
    </div>
  }

  <app-table
    [tableId]="tableId()"
    [items]="items()"
    [columns]="columns()"
    [isTableIsolated]="isTableIsolated()"
    [columnUniqueOptions]="currentColumnUniqueItems()!"
    [isLoadingMore]="stateService.loadingUniqueItems()"
    [initialSearchCriteria]="initialSearchCriteria()"

    (search)="onSearch($event)"
    (sortChanged)="onTableSortChanged($event)"
    (loadMoreItems)="onLoadMore($event)"
    (loadInitialOptions)="loadUniqueItems($event.column, $event.filter)"
    (loadMoreOptions)="loadMoreUniqueItems($event.column, $event.filter)"
    (selectedItemsEvent)="selectedItemsEvent.emit($event)"
    (rowDoubleClicked)="rowDoubleClickedEvent.emit($event)"
    (contextmenu)="onRowRightClick($event, $event)"
  >
  </app-table>

  <app-context-menu
    [selectedItem]="selectedWorkRequest()"
    [isVisible]="contextMenuVisible()"
    [position]="contextMenuPosition()"
    [actions]="contextMenuActions()"
    (closeMenu)="contextMenuVisible.set(false)"
    (actionSelected)="onContextMenuAction($event)"
  />
</div>
