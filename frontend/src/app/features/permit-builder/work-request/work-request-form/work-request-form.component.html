@if(isFormReady()){
    <app-reactive-form
        [fields]="fields()"
        [layout]="'column'"
        [values]="values()"
        [title]="'Work Request'"
        (formSubmit)="onFormSubmit($event)"
        (formDelete)="onFormDelete()"
    ></app-reactive-form>

}@else {
    <p>Loading form...</p>
}
