<div class="nested-input-container">
  <div *ngFor="let control of formArray.controls; let i = index" class="nested-input-item">
    <app-invisible-input-field 
      [formControl]="control"
      [type]="type"
      [style]="customStyle">
    </app-invisible-input-field>
    <button type="button" (click)="removeItem(i)" class="remove-item-btn">-</button>
  </div>
  <button type="button" (click)="addItem()" class="add-item-btn">Add Item</button>
</div>
