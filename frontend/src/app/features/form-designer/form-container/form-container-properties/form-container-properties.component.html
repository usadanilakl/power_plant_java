@if (container) {
  <div class="properties-panel">
    <h3>{{getContainerName()}}</h3>

    <div class="property-group">
      <label>Container</label>
      <div class="input-row">
        <div class="input-field">
          <label for="containerName">Name</label>
          <input id="containerName" type="text" [(ngModel)]="container.name" (ngModelChange)="onPropertyChange()">
        </div>
        <div class="input-field">
          <label for="pageNumber">Page</label>
          <select id="pageNumber" [ngModel]="container.pageNumber" (ngModelChange)="setPageNumber(+$event)">
            @for(page of pages(); track page){
              <option [value]="page">{{page}}</option>
            }
          </select>
        </div>
      </div>
    </div>
    <div class="property-group">
      <label>Position</label>
      <div class="input-row">
        <div class="input-field">
          <label for="posX">X</label>
          <input id="posX" type="number" [(ngModel)]="container.position.x" (ngModelChange)="onPropertyChange()">
        </div>
        <div class="input-field">
          <label for="posY">Y</label>
          <input id="posY" type="number" [(ngModel)]="container.position.y" (ngModelChange)="onPropertyChange()">
        </div>
      </div>
    </div>

    <div class="property-group">
      <label>Size</label>
      <div class="input-row">
        <div class="input-field">
          <label for="width">Width</label>
          <input id="width" type="number" [(ngModel)]="container.size.width" (ngModelChange)="onPropertyChange()">
        </div>
        <div class="input-field">
          <label for="height">Height</label>
          <input id="height" type="number" [(ngModel)]="container.size.height" (ngModelChange)="onPropertyChange()">
        </div>
      </div>
    </div>

    <div class="property-group">
      <label>Style</label>
      <div class="input-row">
        <div class="input-field">
          <label for="backgroundColor">Background</label>
          <input id="backgroundColor" type="color" [(ngModel)]="container.style.backgroundColor" (ngModelChange)="onPropertyChange()">
        </div>
        <div class="input-field">
          <label for="borderColor">Border Color</label>
          <input id="borderColor" type="color" [(ngModel)]="container.style.borderColor" (ngModelChange)="onPropertyChange()">
        </div>
      </div>
      <div class="input-row">
        <div class="input-field">
          <label for="borderRadius">Border Radius</label>
          <input id="borderRadius" type="text" placeholder="e.g., 5px or 50%" [(ngModel)]="container.style.borderRadius" (ngModelChange)="onPropertyChange()">
        </div>
      </div>
    </div>

    <div class="property-group">
      <label>Border Visibility</label>
      <div class="input-row border-toggle-buttons">
        <button (click)="toggleBorder('Top')" [class.active]="isBorderVisible('Top')">Top</button>
        <button (click)="toggleBorder('Right')" [class.active]="isBorderVisible('Right')">Right</button>
        <button (click)="toggleBorder('Bottom')" [class.active]="isBorderVisible('Bottom')">Bottom</button>
        <button (click)="toggleBorder('Left')" [class.active]="isBorderVisible('Left')">Left</button>
      </div>
    </div>

    <div class="property-group">
      <label>Border Thickness</label>
      <div class="input-row">
        <div class="input-field">
          <label for="borderTopWidth">Top</label>
          <input id="borderTopWidth" type="text" placeholder="e.g., 1px" [(ngModel)]="container.style.borderTopWidth" (ngModelChange)="onPropertyChange()">
        </div>
        <div class="input-field">
          <label for="borderRightWidth">Right</label>
          <input id="borderRightWidth" type="text" placeholder="e.g., 1px" [(ngModel)]="container.style.borderRightWidth" (ngModelChange)="onPropertyChange()">
        </div>
      </div>
      <div class="input-row">
        <div class="input-field">
          <label for="borderBottomWidth">Bottom</label>
          <input id="borderBottomWidth" type="text" placeholder="e.g., 1px" [(ngModel)]="container.style.borderBottomWidth" (ngModelChange)="onPropertyChange()">
        </div>
        <div class="input-field">
          <label for="borderLeftWidth">Left</label>
          <input id="borderLeftWidth" type="text" placeholder="e.g., 1px" [(ngModel)]="container.style.borderLeftWidth" (ngModelChange)="onPropertyChange()">
        </div>
      </div>
    </div>

    <div class="property-group">
      <label>Content</label>
      <div class="input-row">
        <div class="input-field">
          <label for="contentType">Content Type</label>
          <select id="contentType" [(ngModel)]="container.contentType" (ngModelChange)="onContentTypeChange()">
            <option value="text">Text</option>
            <option value="formField">Form Field</option>
            <option value="variable">Dynamic Content</option>
            <option value="image">Image</option>
          </select>
        </div>
      </div>

      @switch (container.contentType) {
        @case ('text') {
          <div class="input-row">
            <div class="input-field">
              <label for="textContent">Text</label>
              <textarea id="textContent" [(ngModel)]="container.content" (ngModelChange)="onPropertyChange()"></textarea>
            </div>
          </div>
        }
        @case ('variable') {
          <div class="input-row">
            <div class="input-field">
              <label for="formFieldContent">Field</label>
              <select id="formFieldContent" [(ngModel)]="container.content" [compareWith]="compareFields" (ngModelChange)="onPropertyChange()">
                <option [ngValue]="null">-- Select Field --</option>
                @for (field of flattenedFields; track field.path) {
                  <option [ngValue]="field.path">{{ field.label }}</option>
                }
              </select>
            </div>
          </div>
        }
        @case ('formField') {
          @if(isFormFieldContent(container.content)){
            <div class="input-row">
              <div class="input-field">
                <label for="formFieldName">Field Name</label>
                <select id="formFieldName" [(ngModel)]="container.content.name" (ngModelChange)="onPropertyChange()">
                  <option value="">-- Select Field --</option>
                  @for (field of flattenedFields; track field.path) {
                    <option [value]="field.path">{{ field.label }}</option>
                  }
                </select>
              </div>
            </div>
            <div class="input-row">
              <div class="input-field">
                <label for="formFieldType">Field Type</label>
                <select id="formFieldType" [(ngModel)]="container.content.type" (ngModelChange)="onPropertyChange()">
                  @for(type of formFieldTypes; track type){
                    <option [value]="type">{{ type | titlecase }}</option>
                  }
                </select>
              </div>
            </div>
          }
        }
        @case ('image') {
          <div class="input-row">
            <div class="input-field">
              <label for="imageContent">Image</label>
              <input id="imageContent" type="file" (change)="onFileSelected($event)" accept="image/*">
            </div>
          </div>
        }
      }
    </div>

    <div class="property-group">
      <label>Content Position</label>
      <div class="input-row">
        <div class="input-field">
          <label for="justifyContent">Justify</label>
          <select id="justifyContent" [(ngModel)]="container.style.justifyContent" (ngModelChange)="onPropertyChange()">
            <option value="flex-start">Start</option>
            <option value="center">Center</option>
            <option value="flex-end">End</option>
            <option value="space-between">Space Between</option>
            <option value="space-around">Space Around</option>
          </select>
        </div>
        <div class="input-field">
          <label for="alignItems">Align</label>
          <select id="alignItems" [(ngModel)]="container.style.alignItems" (ngModelChange)="onPropertyChange()">
            <option value="flex-start">Start</option>
            <option value="center">Center</option>
            <option value="flex-end">End</option>
            <option value="stretch">Stretch</option>
          </select>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="delete-button" (click)="onDelete()">Delete Container</button>
    </div>
  </div>
}
