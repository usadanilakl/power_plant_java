<div class="form-binder-container">
  @for (binding of formBindings(); track binding.formDefinition.id) {
    <app-form-renderer
      [formDefinition]="binding.formDefinition"
      [formData]="binding.formData()"
      (formSubmit)="onFormSubmit($event, binding)">
    </app-form-renderer>
  }
</div><p>form-binder works!</p>
