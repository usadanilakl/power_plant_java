<div class="scheduler-container" [class.execute-mode]="viewMode === 'execute'">
  <!-- Top bar -->
  <div class="scheduler-toolbar">
    <app-flow-selector
      [flows]="(state.flows$ | async) ?? []"
      [selectedFlow]="activeFlow"
      (flowSelected)="onFlowSelected($event)"
      (createFlow)="onCreateFlow()"
      (deleteFlow)="onDeleteFlow($event)">
    </app-flow-selector>

    <div class="toolbar-actions" *ngIf="activeFlow">
      <!-- Mode toggle -->
      <button class="btn-mode" [class.active-build]="viewMode === 'build'"
              [class.active-execute]="viewMode === 'execute'"
              (click)="onToggleMode()">
        {{ viewMode === 'build' ? 'Builder' : 'Execute' }}
      </button>

      <!-- Builder-only controls -->
      <ng-container *ngIf="viewMode === 'build'">
        <button class="btn-add-task" (click)="onAddTask()">
          {{ drilledTask ? '+ Add Step' : '+ Add Task' }}
        </button>

        <div class="template-dropdown" *ngIf="!drilledTask && templates.length > 0">
          <button class="btn-template" (click)="toggleTemplateMenu()">From Template</button>
          <div class="template-menu" *ngIf="showTemplateMenu">
            <button *ngFor="let t of templates" (click)="onInstantiateTemplate(t)">
              {{ t.name }}
              <span class="tmpl-meta">{{ t.taskType }}</span>
            </button>
          </div>
        </div>

        <a class="btn-nav" routerLink="/scheduler/templates">Templates</a>
      </ng-container>

      <a class="btn-nav" routerLink="/scheduler/table">Table</a>
    </div>
  </div>

  <!-- Breadcrumb -->
  <div class="breadcrumb" *ngIf="drilledTask">
    <span class="crumb clickable" (click)="onDrillOut()">
      {{ activeFlow?.name || 'Flow' }}
    </span>
    <span class="crumb-sep">/</span>
    <span class="crumb active">{{ drilledTask?.name || 'Task' }} (Steps)</span>
  </div>

  <!-- Main content -->
  <div class="scheduler-content">
    <!-- DAG canvas -->
    <div class="dag-panel">
      <app-dag-renderer
        *ngIf="activeFlow"
        [tasks]="visibleTasks"
        [selectedTaskId]="selectedTask?.id ?? null"
        [viewMode]="viewMode"
        (taskClicked)="onTaskClicked($event)"
        (taskDoubleClicked)="onTaskDoubleClicked($event)"
        (canvasClicked)="onCanvasClicked()"
        (linkCreated)="onLinkCreated($event)"
        (contextAction)="onContextAction($event)">
      </app-dag-renderer>

      <div class="empty-state" *ngIf="!activeFlow">
        <p>Select or create a flow to get started</p>
      </div>

      <div class="empty-state" *ngIf="activeFlow && visibleTasks.length === 0 && !drilledTask">
        <p>No tasks yet. Switch to Builder mode and click "+ Add Task" to create one.</p>
      </div>

      <div class="empty-state" *ngIf="drilledTask && visibleTasks.length === 0">
        <p>No steps yet. Switch to Builder mode and click "+ Add Step" to create one.</p>
      </div>
    </div>

    <!-- Detail sidebar (always in DOM, CSS-toggled) -->
    <app-task-detail-sidebar
      [task]="selectedTask"
      [allTasks]="visibleTasks"
      [isDrilledView]="!!drilledTask"
      [viewMode]="viewMode"
      (closed)="onSidebarClosed()"
      (taskUpdated)="onTaskUpdated($event)"
      (taskDeleted)="onTaskDeleted($event)"
      (statusChanged)="onStatusChanged($event)"
      (prerequisitesChanged)="onPrerequisitesChanged($event)"
      (addStep)="onAddStepFromSidebar($event)"
      (drillInto)="onDrillInto($event)"
      (fileUploaded)="onFileUploaded($event)"
      (attachmentRemoved)="onAttachmentRemoved($event)"
      (referenceAdded)="onReferenceAdded($event)"
      (referenceRemoved)="onReferenceRemoved($event)"
      (saveAsTemplate)="onSaveAsTemplate($event)">
    </app-task-detail-sidebar>
  </div>
</div>
