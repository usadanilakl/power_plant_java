<div class="file-menu-container">
  <div class="menu-header">
    <h2 [appQa]="{text: 'This is the PID Editing System. Use this panel to manage your engineering files — PID, Electrical, Heat Trace, and Isometric drawings. You can add new files, upload multiple files at once, filter by type, and navigate the file tree.', videoUrl: 'qa-data/PID - Editing System.mkv'}">Files</h2>
    <div class="header-actions">
      <button class="icon-button add-button" (click)="onAddNewFile()" title="Add New File">
        <span class="icon">+</span>
      </button>
      <button class="icon-button multi-upload-button" (click)="onMultiUpload()" title="Upload Multiple Files">
        <span class="icon">📁</span>
      </button>
      <button class="icon-button refresh-button" (click)="refresh()" [disabled]="isLoading()" title="Refresh">
        <span class="icon">↻</span>
      </button>
    </div>
  </div>

  <div class="file-type-controls">
    <label class="controls-label">File Type:</label>
    <div class="file-type-buttons">
      @for (type of fileTypes(); track type) {
        <button
          class="type-button"
          [class.active]="selectedType() === type"
          (click)="loadFiles(type)"
          [disabled]="isLoading()"
        >{{ type }}</button>
      }
    </div>
  </div>

  <div class="file-group-controls">
    <label class="controls-label">Group by:</label>
    <select class="file-group-picker"
            [value]="effectiveGroupBy()"
            (change)="onGroupByChange($any($event.target).value)"
            [disabled]="isLoading() || !selectedType()"
            title="How the file list is grouped. Default follows the file type (P&ID→vendor, electrical/iso/heat-trace→system, else Type). Resets on file-type change.">
      @for (g of availableGroupKeys; track g) {
        <option [value]="g">{{ g === 'fileType' ? 'Type' : (g.charAt(0).toUpperCase() + g.slice(1)) }}</option>
      }
    </select>
  </div>

  @if (isLoading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <span>Loading files...</span>
    </div>
  } @else if (error()) {
    <div class="error-state">
      <span class="error-icon">⚠️</span>
      <span class="error-message">{{ error() }}</span>
      <button class="retry-button" (click)="refresh()">Retry</button>
    </div>
  } @else {
    <app-rf-toggle-menu
      [menuItems]="menuItems()"
      [enableSearch]="true"
      [searchPlaceholder]="'Search files...'"
      (itemDblClick)="onItemDoubleClick($event)"
      (itemClick)="onItemClick($event)"
      (itemRightClick)="onItemRightClick($event)"
    ></app-rf-toggle-menu>
  }
</div>

<!-- Multi-Upload Dialog -->
@if (showMultiUpload()) {
  <app-rf-multi-upload
    (close)="onMultiUploadClose()"
    (uploadComplete)="onMultiUploadComplete($event)"
  ></app-rf-multi-upload>
}
