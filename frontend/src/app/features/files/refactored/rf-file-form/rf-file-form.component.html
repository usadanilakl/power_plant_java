<div class="file-form-wrapper">
  <!-- File Auto-Fill Toggles -->
  <div class="file-autofill-section">
    <div class="toggle-row">
      <label class="toggle-label">
        <input
          type="checkbox"
          [checked]="useFileNameAsFileNumber()"
          (change)="onUseFileNumberToggle($any($event.target).checked)"
        />
        <span class="toggle-text">Add file name to "File Number"</span>
      </label>
      <label class="toggle-label">
        <input
          type="checkbox"
          [checked]="useFileNameAsName()"
          (change)="onUseFileNameToggle($any($event.target).checked)"
        />
        <span class="toggle-text">Use file name as "File Name"</span>
      </label>
    </div>
    @if (selectedFileName()) {
      <span class="selected-file-hint">Selected file: {{ selectedFileName() }}</span>
    }
  </div>

  <app-rf-reactive-form
    [entity]="entity()"
    [fields]="fields()"
    [title]="'File Form'"
    (formValueChange)="onAnyValueChange($event)"
    (formSubmit)="onSubmit($event)"
    (fileSelected)="onFileSelected($event)"
  >
    <ng-container extra-buttons>
      <app-clipboard-form
        [entityType]="'File'"
        [initialEntity]="initialEntity()"
        [currentEntity]="entity()"
        [hasValidData]="hasValidData"
        [getItemSummary]="getItemSummary"
        [clipboardFormatter]="clipboardFormatter"
        [excludeIdOnPaste]="true"
        (itemSelected)="onClipboardItemSelected($event)"
      ></app-clipboard-form>
    </ng-container>
  </app-rf-reactive-form>

  <!-- Processing Overlay -->
  @if (isProcessing()) {
    <div class="processing-overlay">
      <div class="processing-content">
        <div class="spinner"></div>
        <span class="processing-message">{{ processingMessage() }}</span>
      </div>
    </div>
  }
</div>

<!-- Draft Comparison Dialog -->
@if (showDraftDialog() && serverEntity() && draftEntity()) {
  <app-file-draft-comparison-dialog
    [serverVersion]="serverEntity()!"
    [draftVersion]="draftEntity()!"
    [draftTimestamp]="draftTimestamp()"
    [fields]="fields()"
    (useServer)="onUseServer()"
    (useDraft)="onUseDraft()"
    (cancel)="onCancelDraftDialog()"
  ></app-file-draft-comparison-dialog>
}
