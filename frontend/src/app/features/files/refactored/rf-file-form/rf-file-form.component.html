<app-rf-reactive-form
  [entity]="entity()"
  [fields]="fields()"
  [title]="'File Form'"
  (formValueChange)="onAnyValueChange($event)"
  (formSubmit)="onSubmit($event)"
>
  <ng-container extra-buttons>
    <app-clipboard-form
      [entityType]="'File'"
      [initialEntity]="initialEntity()"
      [hasValidData]="hasValidData"
      [getItemSummary]="getItemSummary"
      (itemSelected)="onClipboardItemSelected($event)"
    ></app-clipboard-form>
  </ng-container>
</app-rf-reactive-form>

<!-- Draft Comparison Dialog -->
@if (showDraftDialog() && serverEntity() && draftEntity()) {
  <app-file-draft-comparison-dialog
    [serverVersion]="serverEntity()!"
    [draftVersion]="draftEntity()!"
    [draftTimestamp]="draftTimestamp()"
    [fields]="fields()"
    (useServer)="onUseServer()"
    (useDraft)="onUseDraft()"
    (cancel)="onCancelDraftDialog()"
  ></app-file-draft-comparison-dialog>
}
