<app-floating-menu 
  [title]="'Bulk Edit Menu'"

  [height]="40" 
  [position]="MenuPosition.TopLeft"

  (close)="handleClose()">

    <app-details-form
    [fields]="fields()"
    [values]="currentValues()"
    [layout]="'reactive'"
    (formSubmit)="onFormSubmit($event)">
    </app-details-form>


</app-floating-menu>
