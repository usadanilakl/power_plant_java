  <div class="tables-container">
    <div class="table-wrapper">
      <h3>Selected Points</h3>
        <app-equipment-table
            [equipmentList]="currentItems"
        >
        </app-equipment-table>
    </div>
    <div class="table-wrapper">
      <h3>Search Points</h3>
      <app-searchable-dropdown
      [label]="'Get Points From Selected File'"
      [options]="fileOptions()"
      (valueChange)="handleFileSelect($event)"
      ></app-searchable-dropdown>
      <button (click)="copyAllPoints()">Copy All Points</button>
        <app-equipment-table
            [equipmentList]="filteredItems"
            (equipmentDoubleClicked)="copyEquipmentToCurrent($event.item)"
            (searchTableEvent)="onSearchtable($event)"
        >
        </app-equipment-table>
    </div>
  </div>
