  @if(isFormReady()){
  <app-reactive-form
      [fields]="fields()"
      [values]="entity()"
      [layout]="'reactive'"
      (formSubmit)="onFormSubmit($event)"
      (formDelete)="onFormDelete()">
  </app-reactive-form>
<button type="button" (click)="onOpenImage()">Open Image</button>
} @else {
  <p>Loading form...</p>
}
