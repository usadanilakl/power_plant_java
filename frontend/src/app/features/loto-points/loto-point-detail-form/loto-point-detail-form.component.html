@if (isFormReady) {
  <app-details-form
    [fields]="fields"
    [values]="values"
    (formSubmit)="onFormSubmit($event)"
    (formDelete)="onFormDelete()">
  </app-details-form>

  @if (imageUrls$ | async; as imageUrls) {
    <app-image-carousel
      [images]="imageUrls"
      [equipmentFilter]="isEquipmentFilterInitialized ? equipmentFilter : []">
    </app-image-carousel>
  }

  <!-- <button type="button" (click)="onOpenImage()">Open Image</button> -->
} @else {
  <p>Loading form...</p>
}
