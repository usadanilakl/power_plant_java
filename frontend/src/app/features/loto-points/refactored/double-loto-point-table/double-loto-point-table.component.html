<div class="double-table-container">
  @if (!hideSource()) {
    <app-source-loto-point-table></app-source-loto-point-table>
    <div class="divider"></div>
  }
  <app-destination-loto-point-table></app-destination-loto-point-table>
</div>

<!-- Details popup on double-click of either dual-table row is rendered
     by the page-level popup on rf-loto-standard-page.component.html —
     doubleTableService.viewPoint() delegates to
     RfLotoPointStateService.loadItemById + openForm, and that popup
     picks dual-form vs single form based on counterpart-eligibility.
     Reusing the shared popup means points without a counterpart still
     get a proper form (same as the context-menu "View Details" action)
     instead of the dual-form template rendering nothing. -->
