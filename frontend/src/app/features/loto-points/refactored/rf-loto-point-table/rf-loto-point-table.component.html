
<div class="loto-point-table-container">
  <!-- Error message display -->
  @if (errorMessage()) {
    <div class="error-message">
      {{ errorMessage() }}
    </div>
  }

  <!-- Loading indicator -->
  @if (isLoading()) {
    <div class="loading-indicator">
      Loading LOTO points...
    </div>
  }

  <!-- Table component -->
  <app-table
    [items]="items()"
    [columns]="columns()"
    [columnUniqueOptions]="stateService.currentColumnUniqueItems()"
    [isDragAndDropEnabled]="enableDragDrop()"
    [hoverDebounceTime]="hoverDebounceTime()"
    [filterOutItems]="filterOutItems()"
    (rowClicked)="onRowLeftClick($event)"
    (rowDoubleClicked)="onRowDoubleClick($event)"
    (rowRightClicked)="onRowRightClick($event)"
    (rowMiddleClicked)="onRowMiddleClick($event)"
    (cellDoubleClicked)="onCellDoubleClick($event)"
    (selectedItemsEvent)="onSelectedItems($event)"
    (itemsReordered)="onItemsReordered($event)"
    (search)="onSearch($event)"
    (sortChanged)="onTableSortChanged($event)"
    (loadMoreItems)="onLoadMore($event)"
    (loadInitialOptions)="loadUniqueItems($event.column, $event.filter)"
    (loadMoreOptions)="loadMoreUniqueItems($event.column, $event.filter)"
    >
    <div table-controls>
      <ng-content select="[table-controls]"></ng-content>
    </div>
    <div table-selection-actions>
      <app-buttons [buttons]="selectionControlButtons()"></app-buttons>
    </div>
  </app-table>
</div>
