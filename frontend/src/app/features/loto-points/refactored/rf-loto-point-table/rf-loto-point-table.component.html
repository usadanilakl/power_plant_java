<div class="loto-point-table-container">
  <!-- Error message display -->
  @if (errorMessage()) {
    <div class="error-message">
      {{ errorMessage() }}
    </div>
  }

  <!-- Loading indicator -->
  @if (isLoading()) {
    <div class="loading-indicator">
      Loading LOTO points...
    </div>
  }

  <!-- Table component -->
  <app-table
    #tableComponent
    [items]="items()"
    [columns]="columns()"
    [columnUniqueOptions]="stateService.currentColumnUniqueItems()"
    [isLoadingMore]="stateService.loadingUniqueItems()"
    [isDragAndDropEnabled]="enableDragDrop()"
    [hoverDebounceTime]="hoverDebounceTime()"
    [filterOutItems]="filterOutItems()"

    (search)="onSearch($event)"
    (sortChanged)="onTableSortChanged($event)"
    (loadMoreItems)="onLoadMore($event)"
    (loadInitialOptions)="loadUniqueItems($event.column, $event.filter)"
    (loadMoreOptions)="loadMoreUniqueItems($event.column, $event.filter)"
    >

  </app-table>
</div>

<app-context-menu
  [selectedItem]="contextMenuService.contextMenuSelectedItem()"
  [isVisible]="contextMenuService.contextMenuVisible()"
  [position]="contextMenuService.contextMenuPosition()"
  [actions]="contextMenuService.contextMenuActions"
  (closeMenu)="contextMenuService.closeContextMenu()"
></app-context-menu>

<app-rf-popup-projection
  [isOpen]="stateService.isLotoPointFormOpen()"
  (close)="stateService.closeForm()"
>
  
<app-rf-loto-point-form [fieldsInput]="stateService.formFields()"></app-rf-loto-point-form>

</app-rf-popup-projection>
