<!-- Draft Comparison Dialog -->
@if (showDraftDialog() && serverEntity() && draftEntity()) {
  <app-draft-comparison-dialog
    [serverVersion]="serverEntity()!"
    [draftVersion]="draftEntity()!"
    [draftTimestamp]="draftTimestamp()"
    [fields]="fields()"
    (useServer)="onUseServer()"
    (useDraft)="onUseDraft()"
    (cancel)="onCancelDraftDialog()"
  ></app-draft-comparison-dialog>
}

<div class="form-container">
  <!-- Carousel Navigation -->
  <div class="carousel-nav">
    <button
      class="nav-btn"
      [class.active]="currentSlide() === 0"
      (click)="goToSlide(0)"
    >
      <span class="nav-icon">📝</span>
      <span class="nav-label">Form</span>
    </button>
    <button
      class="nav-btn"
      [class.active]="currentSlide() === 1"
      (click)="goToSlide(1)"
    >
      <span class="nav-icon">🖼️</span>
      <span class="nav-label">Images</span>
    </button>
  </div>

  <!-- Carousel Container -->
  <div class="carousel-container">
    <div class="carousel-track" [style.margin-left]="'-' + (currentSlide() * 100) + '%'">

      <!-- Slide 1: Form -->
      <div class="carousel-slide">
        <div class="slide-content">
          <!-- AI Form Assistant -->
          <app-ai-form-assistant
            [formType]="'lotoPoint'"
            [fields]="fields()"
            [currentValues]="reactiveForm?.getCurrentFormValues() ?? {}"
            (fieldValues)="onAiFill($event)"
          />

          <app-rf-reactive-form
            [entity]="entity()"
            [fields]="fields()"
            [title]="'Loto Point Form'"
            [driftEntityType]="'LotoPoint'"
            [showSubmitButton]="showFormActions()"
            (formValueChange)="onAnyValueChange($event)"
            (formSubmit)="onSubmit($event)"
          >
            <ng-container extra-buttons>
              <button
                type="button"
                class="tag-generator-button"
                (click)="openTagGenerator()"
                title="Generate New Tag Number">
                Generate Tag Number
              </button>
              <button
                type="button"
                class="description-generator-button"
                (click)="openDescriptionGenerator()"
                title="Generate Description">
                Generate Description
              </button>
              @if (canDelete()) {
                <button
                  type="button"
                  class="delete-button"
                  (click)="onDelete()"
                  title="Delete LOTO Point">
                  Delete
                </button>
              }
              <app-clipboard-form
                [entityType]="'LotoPoint'"
                [initialEntity]="initialEntity()"
                [currentEntity]="entity()"
                [hasValidData]="hasValidData"
                [getItemSummary]="getItemSummary"
                [clipboardFormatter]="clipboardFormatter"
                [excludeIdOnPaste]="true"
                (itemSelected)="onClipboardItemSelected($event)"
              ></app-clipboard-form>
            </ng-container>
          </app-rf-reactive-form>
        </div>
      </div>

      <!-- Slide 2: File Viewer -->
      <div class="carousel-slide">
        <div class="slide-content file-viewer-section">
          <app-loto-point-file-viewer
            [lotoPoint]="entity()">
          </app-loto-point-file-viewer>
        </div>
      </div>

    </div>
  </div>

  <!-- Carousel Arrow Controls -->
  <button
    class="carousel-arrow carousel-arrow-left"
    (click)="previousSlide()"
    [disabled]="currentSlide() === 0"
  >
    ‹
  </button>
  <button
    class="carousel-arrow carousel-arrow-right"
    (click)="nextSlide()"
    [disabled]="currentSlide() === 1"
  >
    ›
  </button>
</div>

<!-- Tag Number Generator Popup -->
<app-rf-popup-projection
  [isOpen]="isTagGeneratorOpen()"
  [title]="'Generate New Tag Number'"
  [size]="'medium'"
  (close)="closeTagGenerator()">
  <app-tag-number-generator
    (tagGenerated)="onTagGenerated($event)"
    (cancelled)="closeTagGenerator()">
  </app-tag-number-generator>
</app-rf-popup-projection>

<!-- Description Generator Popup -->
<app-rf-popup-projection
  [isOpen]="isDescriptionGeneratorOpen()"
  [title]="'Generate Description'"
  [size]="'medium'"
  (close)="closeDescriptionGenerator()">
  <app-naming-convention
    (nameGenerated)="onDescriptionGenerated($event)">
  </app-naming-convention>
</app-rf-popup-projection>
