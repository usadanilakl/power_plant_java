<app-rf-reactive-form
  [entity]="entity()"
  [fields]="fields()"
  [title]="'Loto Point Form'"
  (formValueChange)="onAnyValueChange($event)"
  (formSubmit)="onSubmit($event)"
>
  <ng-container extra-buttons>
    <div style="display: flex; gap: 8px; align-items: center;">
      <label for="itemNumber">Clipboard Item:</label>
      <input 
        id="itemNumber"
        type="number" 
        [value]="itemNumber()"
        (change)="itemNumber.set($any($event.target).value)"
        min="0"
        [max]="(clipboardItems().length)"
        [disabled]="clipboardItems().length===0"
      >
      <button 
        type="button"
        (click)="loadClipboardItem()"
        [disabled]="!clipboardItem()"
      >
        Load
      </button>
    </div>
  </ng-container>
</app-rf-reactive-form>
