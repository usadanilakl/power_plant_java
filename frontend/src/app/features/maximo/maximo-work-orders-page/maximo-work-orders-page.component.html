<app-main-layout header="Maximo — Work Orders">
  <ng-container header>
    <app-router-menu [layout]="'row'"></app-router-menu>
  </ng-container>
  <ng-container main-content>
    <div class="mx-page">

      <section class="filter-panel">
        <div class="row">
          <label>Status
            <select [(ngModel)]="criteria.status">
              <option *ngFor="let s of statusOptions" [value]="s">{{ s || '(any)' }}</option>
            </select>
          </label>
          <label>Worktype
            <select [(ngModel)]="criteria.worktype">
              <option *ngFor="let w of worktypeOptions" [value]="w">{{ w || '(any)' }}</option>
            </select>
          </label>
          <label>Priority <input [(ngModel)]="criteria.priority" placeholder="numeric" /></label>
          <label>Page <input type="number" [(ngModel)]="pageSize" min="1" max="200" /></label>
        </div>
        <div class="row">
          <label>Assetnum <app-maximo-asset-picker [(ngModel)]="criteria.assetnum" placeholder="tag / description"></app-maximo-asset-picker></label>
          <label>Location <app-maximo-location-picker [(ngModel)]="criteria.location" placeholder="code / description"></app-maximo-location-picker></label>
          <label>Lead craft <app-maximo-person-picker [(ngModel)]="criteria.leadCraft" placeholder="RGARCIA"></app-maximo-person-picker></label>
          <label>Supervisor <app-maximo-person-picker [(ngModel)]="criteria.supervisor" placeholder="personid"></app-maximo-person-picker></label>
          <label>Site <input [(ngModel)]="criteria.siteid" placeholder="default JG" /></label>
        </div>
        <div class="row">
          <label>Sched start ≥
            <input type="datetime-local"
                   [ngModel]="toLocal(criteria.schedstartFrom)"
                   (ngModelChange)="criteria.schedstartFrom = fromLocal($event)" />
          </label>
          <label>Sched finish ≤
            <input type="datetime-local"
                   [ngModel]="toLocal(criteria.schedfinishTo)"
                   (ngModelChange)="criteria.schedfinishTo = fromLocal($event)" />
          </label>
        </div>
        <div class="row">
          <label>Reported ≥
            <input type="datetime-local"
                   [ngModel]="toLocal(criteria.reportdateFrom)"
                   (ngModelChange)="criteria.reportdateFrom = fromLocal($event)" />
          </label>
          <label>Reported ≤
            <input type="datetime-local"
                   [ngModel]="toLocal(criteria.reportdateTo)"
                   (ngModelChange)="criteria.reportdateTo = fromLocal($event)" />
          </label>
        </div>
        <div class="row">
          <label>WO # contains <input [(ngModel)]="criteria.wonumContains" placeholder="J26-" /></label>
          <label>Search text
            <input [(ngModel)]="criteria.textContains" class="wide"
                   placeholder="title + details — words narrow (e.g. “unit 2 sample panel”)" />
          </label>
        </div>
        <div class="row actions">
          <button (click)="apply()" [disabled]="loading()">{{ loading() ? 'Loading…' : 'Apply filters' }}</button>
          <button class="secondary" (click)="clear()">Clear</button>
          <span class="muted">{{ activeFilterCount() }} filter(s) active</span>
          <span *ngIf="error()" class="error">{{ error() }}</span>
        </div>
      </section>

      <div class="results-header">
        <h3>
          {{ showingLatest() ? 'Latest work orders' : 'Results' }}
          <span class="muted" *ngIf="loaded()">({{ list().length }})</span>
        </h3>
        <span class="muted" *ngIf="showingLatest() && loaded()">
          newest {{ pageSize }} for the site — set filters above to narrow
        </span>
      </div>

      <div *ngIf="!loaded()" class="muted empty-msg">
        {{ loading() ? 'Loading the latest work orders…' : 'Set filters above and click Apply.' }}
      </div>

      <app-maximo-table *ngIf="loaded()"
        [columns]="columns"
        [items]="list()"
        emptyMessage="No work orders match these filters."
        (rowDoubleClicked)="openDetail($event)">
      </app-maximo-table>

      <app-maximo-detail-dialog
        *ngIf="selectedWo()"
        [parent]="'wo'"
        [wo]="selectedWo()"
        (completed)="apply()"
        (closed)="closeDetail()">
      </app-maximo-detail-dialog>
    </div>
  </ng-container>
</app-main-layout>
