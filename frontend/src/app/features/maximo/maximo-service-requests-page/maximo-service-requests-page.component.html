<app-main-layout header="Maximo — Service Requests">
  <ng-container header>
    <app-router-menu [layout]="'row'"></app-router-menu>
  </ng-container>
  <ng-container main-content>
    <div class="mx-page">

      <section class="filter-panel">
        <div class="row">
          <label>Status
            <select [(ngModel)]="criteria.status">
              <option *ngFor="let s of statusOptions" [value]="s">{{ s || '(any)' }}</option>
            </select>
          </label>
          <label>Priority <input [(ngModel)]="criteria.priority" placeholder="numeric" /></label>
          <label>Page <input type="number" [(ngModel)]="pageSize" min="1" max="200" /></label>
        </div>
        <div class="row">
          <label>Assetnum <input [(ngModel)]="criteria.assetnum" placeholder="-1-CEM-SS" /></label>
          <label>Location <input [(ngModel)]="criteria.location" placeholder="01-CEMS" /></label>
          <label>Site <input [(ngModel)]="criteria.siteid" placeholder="default JG" /></label>
        </div>
        <div class="row">
          <label>Reported by <app-maximo-person-picker [(ngModel)]="criteria.reportedby" placeholder="personid"></app-maximo-person-picker></label>
          <label>Affected person <app-maximo-person-picker [(ngModel)]="criteria.affectedperson" placeholder="personid"></app-maximo-person-picker></label>
        </div>
        <div class="row">
          <label>Report date ≥
            <input type="datetime-local"
                   [ngModel]="toLocal(criteria.reportdateFrom)"
                   (ngModelChange)="criteria.reportdateFrom = fromLocal($event)" />
          </label>
          <label>Report date ≤
            <input type="datetime-local"
                   [ngModel]="toLocal(criteria.reportdateTo)"
                   (ngModelChange)="criteria.reportdateTo = fromLocal($event)" />
          </label>
        </div>
        <div class="row">
          <label>Description contains <input [(ngModel)]="criteria.descriptionContains" placeholder="title only" class="wide" /></label>
        </div>
        <div class="row">
          <label>Long description contains <input [(ngModel)]="criteria.longDescriptionContains" placeholder="long-text body" class="wide" /></label>
        </div>
        <div class="row actions">
          <button (click)="apply()" [disabled]="loading()">{{ loading() ? 'Loading…' : 'Apply filters' }}</button>
          <button class="secondary" (click)="clear()">Clear</button>
          <button (click)="showForm.set(!showForm())">{{ showForm() ? 'Close form' : '+ New SR' }}</button>
          <span class="muted">{{ activeFilterCount() }} filter(s) active</span>
          <span *ngIf="error()" class="error">{{ error() }}</span>
        </div>
      </section>

      <app-maximo-sr-submit
        *ngIf="showForm()"
        [tagNumber]="criteria.assetnum || null"
        [defaultSite]="criteria.siteid || 'JG'"
        (submitted)="onSrSubmitted($event)"
        (cancel)="showForm.set(false)">
      </app-maximo-sr-submit>

      <div class="results-header">
        <h3>Results <span class="muted" *ngIf="loaded()">({{ list().length }})</span></h3>
      </div>

      <div *ngIf="!loaded()" class="muted empty-msg">Set filters above and click Apply.</div>

      <app-maximo-table *ngIf="loaded()"
        [columns]="columns"
        [items]="list()"
        emptyMessage="No service requests match these filters."
        (rowDoubleClicked)="openDetail($event)">
      </app-maximo-table>

      <app-maximo-detail-dialog
        *ngIf="selectedSr()"
        [parent]="'sr'"
        [sr]="selectedSr()"
        (closed)="closeDetail()">
      </app-maximo-detail-dialog>
    </div>
  </ng-container>
</app-main-layout>
