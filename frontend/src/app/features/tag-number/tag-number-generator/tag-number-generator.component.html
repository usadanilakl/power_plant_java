<div class="tag-generator-container" style="max-width: 600px; margin: 0 auto; padding: 20px; font-family: Arial, sans-serif;">
  <h2 style="text-align: center; color: #333;">Tag Number Generator</h2>
  
  <form (ngSubmit)="onSubmit()" style="margin-bottom: 20px;">
    <div style="margin-bottom: 10px;">
      <label for="unit" style="display: block; margin-bottom: 5px;">Unit:</label>
      <input type="text" id="unit" name="unit" [(ngModel)]="unit" required 
             style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    <div style="margin-bottom: 10px;">
      <label for="equipmentType" style="display: block; margin-bottom: 5px;">Equipment Type:</label>
      <input type="text" id="equipmentType" name="equipmentType" [(ngModel)]="equipmentType" required 
             style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    <div style="margin-bottom: 10px;">
      <label for="system" style="display: block; margin-bottom: 5px;">System:</label>
      <input type="text" id="system" name="system" [(ngModel)]="system" required 
             style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    <button type="submit" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">Generate Tag Number</button>
  </form>

  <div *ngIf="generatedTagNumber" style="text-align: center; margin: 20px 0; padding: 20px; background-color: #f0f0f0; border-radius: 4px;">
    <h3 style="margin-bottom: 10px; color: #333;">Generated Tag Number:</h3>
    <p style="font-size: 24px; font-weight: bold; color: #4CAF50;">{{ generatedTagNumber }}</p>
  </div>

  <div *ngIf="errorMessage" class="error-message" style="color: red; text-align: center; margin-bottom: 20px;">
    {{ errorMessage }}
  </div>

  <app-naming-convention></app-naming-convention>
