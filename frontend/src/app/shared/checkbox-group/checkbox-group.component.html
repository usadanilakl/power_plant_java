<div class="checkbox-group">
  <div class="label-container">
    <label>{{ label }}</label>
    @if (question() && qaService.isQaMode()) {
      <span class="qa-icon" (click)="onQaClick()" title="Click for help">
        <span class="material-icons">help</span>
      </span>
    }
  </div>
  @for (option of options; track option.label; let i = $index) {
    @if (isBoolean(option.value)) {
      <div>
        <input type="checkbox"
               [id]="optionId(i)"
               [value]="option.value"
               [checked]="option.value"
               (change)="onCheckboxChange(option, $event)"
               #checkbox>
        <label [for]="optionId(i)">{{ option.label }}</label>
      </div>
    } @else if(mode === 'array') {
      <div>
        <input type="checkbox"
               [id]="optionId(i)"
               [value]="option.value"
               [checked]="value.includes(option.value)"
               (change)="onCheckboxChange(option, $event)"
               #checkbox>
        <label [for]="optionId(i)">{{ option.label }}</label>
      </div>
    }
  }

</div>
