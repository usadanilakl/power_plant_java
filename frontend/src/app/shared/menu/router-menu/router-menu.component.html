
<nav class="router-menu" [ngClass]="layout()">
  @if (menuItems()) {
    <ul>
      @for (item of menuItems(); track item.route) {
        <li [appGuide]="item.guideId || ''"
            [guideMessage]="item.guideMessage || ''">
          <a [routerLink]="item.route">{{ item.label }}</a>
        </li>
      }
    </ul>
  } @else {
    <p>No menu items available.</p>
  }
</nav>
