<div class="form-input" [ngStyle]="customStyle">
  @if (label && label!=='') {
  <div class="label-container">
    <label>{{ label }}</label>
    @if (question() && qaService.isQaMode()) {
      <span class="qa-icon" (click)="onQaClick()" title="Click for help">
        <span class="material-icons">help</span>
      </span>
    }
  </div>
  }
    <input
      [type]="type"
      [value]="value"
      (input)="onInputChange($event)"
      class="form-input-element">
</div>
