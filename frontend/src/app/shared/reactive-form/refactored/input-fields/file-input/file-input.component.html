<div class="file-input-wrapper">
  <div class="label-container">
    <label class="field-label">{{ label }}</label>
  </div>
  <div class="file-input-container" [class.dragover]="isDragover">
    <div class="drop-zone">
      <p>Drag and drop a file here, or</p>
      <label class="file-input-button">
        Choose File
        <input
          type="file"
          [accept]="accept"
          (change)="onFileSelected($event)"
          class="file-input"
        >
      </label>
    </div>
    @if (file) {
      <div class="file-info">
        <span class="file-name">{{ file.name }}</span>
        <button type="button" class="remove-file" (click)="handleFile(null)">Remove</button>
      </div>
    }
  </div>
</div>
