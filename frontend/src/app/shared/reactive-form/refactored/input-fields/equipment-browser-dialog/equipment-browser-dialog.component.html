<div class="dialog-container">
  <div class="dialog-content">
    <!-- Left Panel: File List -->
    <div class="file-list-panel">
      <h3>Select P&ID</h3>
      <app-rf-toggle-menu
        [menuItems]="menuItems()"
        (itemClick)="onFileSelect($event)"
      ></app-rf-toggle-menu>
    </div>

    <!-- Right Panel: P&ID Viewer -->
    <div class="viewer-panel">
      @if (selectedFile()) {
        <div class="viewer-header">
          <h3>{{ selectedFile()?.name }}</h3>
          @if (selectedEquipment()) {
            <div class="selected-equipment-info">
              <strong>Selected:</strong> {{ selectedEquipment()?.tagNumber }}
            </div>
          }
        </div>
        <div class="viewer-content">
          <app-interactive-image
            [imageUrl]="currentFileLink()"
            [shapesInput]="equipmentShapes()"
            [preset]="'EQUIPMENT_BROWSER'"
            (shapeClicked)="onEquipmentSelected($event)"
          />
        </div>
      } @else {
        <div class="no-selection">
          <p>Select a P&ID file to view equipment</p>
        </div>
      }
    </div>
  </div>

  <!-- Dialog Actions -->
  <div class="dialog-actions">
    <button
      type="button"
      class="btn-cancel"
      (click)="onCancel()">
      Cancel
    </button>
    <button
      type="button"
      class="btn-select"
      [disabled]="!selectedEquipment()"
      (click)="onConfirmSelection()">
      Select Equipment
    </button>
  </div>
</div>
