<div class="clipboard-form-container">
  <div class="clipboard-header" (click)="toggleCollapse()">
    <div class="header-content">
      <h3>Clipboard</h3>
      <span class="item-count">{{ displayItems().length }} items</span>
    </div>
    <button class="collapse-btn" type="button" [class.collapsed]="isCollapsed()">
      <span class="collapse-icon">{{ isCollapsed() ? '▶' : '▼' }}</span>
    </button>
  </div>

  @if (!isCollapsed()) {
    <div class="clipboard-actions">
      <button
        type="button"
        class="add-to-clipboard-btn"
        (click)="addCurrentToClipboard(); $event.stopPropagation()"
        [disabled]="!currentEntity() || !hasValidData()(currentEntity()!)"
        title="Add current form data to clipboard"
      >
        + Add to Clipboard
      </button>
    </div>

    @if (displayItems().length > 0) {
      <div class="clipboard-list">
        @for (item of displayItems(); track $index) {
          <button
            class="clipboard-item"
            (click)="onItemClick(item)"
            type="button"
            title="Click to paste (ID will be excluded)"
          >
            {{ getItemLabel(item, $index) }}
          </button>
        }
      </div>
    } @else {
      <div class="empty-state">No clipboard items available</div>
    }
  }
</div>
