
<div class="table-wrapper" [class.resizing]="resizeService.isResizing()">

  <div class="search-bar">
    <button
      class="filter-logic-toggle global-logic-toggle"
      [class.active]="searchService.getGlobalFilterLogic() === 'OR'"
      (click)="searchService.toggleGlobalFilterLogic()"
      [title]="'Global filter logic: ' + searchService.getGlobalFilterLogic()">
      {{ searchService.getGlobalFilterLogic() }}
    </button>
    <input
      type="text"
      placeholder="Global Search"
      [(ngModel)]="dataService.globalSearchQuery"
      (input)="searchService.onGlobalSearchChange()"
      class="global-search"
    />
  </div>
  
  <div class="table-controls">
    <!-- <ng-content select="[table-controls]"></ng-content> -->
     <app-buttons [buttons]="controlsService.tableControlButtons()"></app-buttons>
  </div>

  <div #headerContainer class="header-container">
    <table #headerTable class="table table-header" [style.width.px]="dataService.totalTableWidth()">
      <thead>
        <tr>
          <th *ngFor="let column of columns()" 
              [style.width.px]="resizeService.getColumnWidth(column.id)"
              class="sortable-header">
            <div class="header-content" (click)="sortService.sortColumn(column, true)">
              <span>{{ column.header }}</span>
              <span *ngIf="dataService.currentSortColumn === column.id" 
                    class="sort-indicator">
                {{ dataService.isAscending ? '▲' : '▼' }}
              </span>
            </div>
            
            <div class="filter-wrapper" *ngIf="column.filterable">
              <button 
                class="filter-logic-toggle"
                [class.active]="searchService.getColumnFilterLogic(column.id) === 'OR'"
                (click)="searchService.toggleColumnFilterLogic(column.id)"
                [title]="'Filter logic: ' + searchService.getColumnFilterLogic(column.id)">
                {{ searchService.getColumnFilterLogic(column.id) }}
              </button>
              
              <app-column-filter-input
                [uniqueValues]="columnUniqueOptions()"
                [isLoadingMore]="isLoadingMore()"
                (filterChange)="searchService.onColumnFilterChange(column.accessorKey || column.id, $event)"
                (loadMoreOptions)="searchService.onLoadMoreColumnFilterOptions(column.accessorKey || column.id,$event)"
                (loadInitialOptions)="searchService.onLoadColumnFilterOptions(column.accessorKey || column.id,$event)"
              ></app-column-filter-input>
            </div>

            <div class="resize-handle"
                 (mousedown)="resizeService.onResizeStart($event, column.id, resizeService.getColumnWidth(column.id))"
                 [class.resizing]="resizeService.getResizingColumnId() === column.id">
            </div>
          </th>
        </tr>
      </thead>
    </table>
  </div>

  <div #tableContainer class="table-container">
    <cdk-virtual-scroll-viewport
      [itemSize]="dataService.rowHeight"
      class="viewport"
    >
      <table #bodyTable class="table table-body" [style.width.px]="dataService.totalTableWidth()">
        <tbody #tableBody>
          <tr
            *cdkVirtualFor="let item of dataService.filteredItems(); trackBy: utilService.trackByItemId"
            [class.drag-hover-top]="item === dataService.hoveredRow() && dragService.dragState().isDragging"
            [class.selected]="selectionService.isItemSelected(item)"
            [class.dragged]="dragService.isItemDragged(item)"
            [class.external-hover]="hoveredItemId() !== null && item.id === hoveredItemId()"
            [ngStyle]="syncService.getRowStyle(item)"
            [class.ghost-row]="dragService.dragState().ghostRowIndex === item.index"
            (mousedown)="dragService.onMouseDown($event, item)"
            (mouseup)="dragService.onMouseUp($event)"
            (dragover)="dragService.onDragOver($event)"
            (click)="clickService.onRowClick(item, $event)"
            (auxclick)="$event.preventDefault(); $event.stopPropagation()"
            (contextmenu)="clickService.onRowRightClick(item, $event)"
            (mouseenter)="clickService.onRowHover(item)"
            (mouseleave)="clickService.onRowLeave()"
          >
            <td
              *ngFor="let column of columns()"
              [attr.data-column-id]="column.id"
              [style.width.px]="resizeService.getColumnWidth(column.id)"
              [ngStyle]="clickService.getCellStyleWithHover(item, column)"
              [attr.title]="!column.template ? utilService.getCellValue(item, column) : null"
              (mousedown)="clickService.registerCellClick(item, column, $event)"
              (auxclick)="clickService.onRowMiddleClick(item, $event)"
              (mouseenter)="clickService.onCellHover(item, column)"
              (mouseleave)="clickService.onCellLeave()"
              class="table-cell"
            >
              <span *ngIf="!column.template">
                {{ utilService.getCellValue(item, column) }}
              </span>
              <ng-container *ngIf="column.template">
                <ng-container *ngTemplateOutlet="column.template; context: { $implicit: item, column: column }"></ng-container>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </cdk-virtual-scroll-viewport>
  </div>

  <div *ngIf="dataService.filteredItems().length === 0" class="empty-state">
    <p>No items found</p>
  </div>

  <div *ngIf="dataService.selectedItems().length > 0" class="selection-info">
    <span>{{ dataService.selectedItems().length }} item(s) selected</span>
     <app-buttons [buttons]="controlsService.tableSelectionControls()"></app-buttons>
  </div>
</div>
