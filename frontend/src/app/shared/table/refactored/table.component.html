
<div class="table-wrapper" [class.resizing]="isResizing()">

  <div class="search-bar">
    <input
      type="text"
      placeholder="Global Search"
      [(ngModel)]="dataService.globalSearchQuery"
      (input)="onGlobalSearchChange()"
      class="global-search"
    />
  </div>
  
  <div class="table-controls">
    <!-- <ng-content select="[table-controls]"></ng-content> -->
     <app-buttons [buttons]="tableControlButtons()"></app-buttons>
  </div>

  <div #headerContainer class="header-container">
    <table #headerTable class="table table-header" [style.width.px]="totalTableWidth">
      <thead>
        <tr>
          <th *ngFor="let column of columns()" 
              [style.width.px]="getColumnWidth(column.id)"
              class="sortable-header">
            <div class="header-content" (click)="sortColumn(column, true)">
              <span>{{ column.header }}</span>
              <span *ngIf="dataService.currentSortColumn === column.id" 
                    class="sort-indicator">
                {{ dataService.isAscending ? '▲' : '▼' }}
              </span>
            </div>
            
            <app-column-filter-input
              *ngIf="column.filterable"
              [uniqueValues]="columnUniqueOptions()"
              [isLoadingMore]="isLoadingMore()"
              (filterChange)="onColumnFilterChange(column.accessorKey!, $event)"
              (loadMoreOptions)="loadMoreOptions.emit({column: column.id, filter: $event})"
              (loadInitialOptions)="loadInitialOptions.emit({column: column.id, filter: $event})"
            ></app-column-filter-input>
            <div class="resize-handle"
                 (mousedown)="onResizeStart($event, column.id, getColumnWidth(column.id))"
                 [class.resizing]="getResizingColumnId() === column.id">
            </div>
          </th>
        </tr>
      </thead>
    </table>
  </div>

  <div #tableContainer class="table-container">
    <cdk-virtual-scroll-viewport
      [itemSize]="rowHeight"
      class="viewport"
    >
      <table #bodyTable class="table table-body" [style.width.px]="totalTableWidth">
        <tbody>
          <tr
            *cdkVirtualFor="let item of dataService.filteredItems; trackBy: trackByItemId"
            [class.drag-hover-top]="item === hoveredItem() && dragState().isDragging"
            [class.selected]="isItemSelected(item)"
            [class.dragged]="isItemDragged(item)"
            [ngStyle]="syncService.getRowStyle(item)"
            [class.ghost-row]="dragState().ghostRowIndex === item.index"
            (mousedown)="onMouseDown($event, item)"
            (mouseup)="onMouseUp($event)"
            (dragover)="onDragOver($event)"
            (click)="clickService.onRowClick(item, $event)"
            (auxclick)="$event.preventDefault(); $event.stopPropagation()"
            (contextmenu)="clickService.onRowRightClick(item, $event)"
            (mouseenter)="clickService.onRowHover(item)"
          >
            <td
              *ngFor="let column of columns()"
              [style.width.px]="getColumnWidth(column.id)"
              [ngStyle]="clickService.getCellStyleWithHover(item, column)"
              (mousedown)="clickService.registerCellClick(item, column, $event)"
              (auxclick)="clickService.onRowMiddleClick(item, $event)"
              (mouseenter)="clickService.onCellHover(item, column)"
              (mouseleave)="clickService.onCellLeave()"
              class="table-cell"
            >
              <span *ngIf="!column.template">
                {{ getCellValue(item, column) }}
              </span>
              <ng-container *ngIf="column.template">
                <ng-container *ngTemplateOutlet="column.template; context: { $implicit: item, column: column }"></ng-container>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </cdk-virtual-scroll-viewport>
  </div>

  <div *ngIf="dataService.filteredItems.length === 0" class="empty-state">
    <p>No items found</p>
  </div>

  <div *ngIf="selectedItems().length > 0" class="selection-info">
    <span>{{ selectedItems().length }} item(s) selected</span>
    <ng-container #selectionActions>
      <ng-content select="[table-selection-actions]" 
                   [ngTemplateOutletContext]="{ $implicit: selectedItems() }">
      </ng-content>
    </ng-container>
    <button (click)="clearSelection()" class="clear-btn">
      Clear Selection
    </button>
  </div>
</div>
