

<div class="radio-group">
  <label>{{ label }}</label>
  @for (option of options; track option.value) {
    <div>
      <input 
        type="radio" 
        [id]="option.value" 
        [name]="name" 
        [value]="option.value" 
        [checked]="value === option.value"
        (change)="onRadioChange(option)"
      >
      <label [for]="option.value">{{ option.label }}</label>
    </div>
  }
</div>
