
<div class="interactive-image-container">
  <!-- Symbol Palette Sidebar -->
  <div class="symbol-palette-sidebar" *ngIf="showSymbolPalette()">
    <app-symbol-palette
      (symbolSelected)="onSymbolSelected($event)">
    </app-symbol-palette>
  </div>

  <!-- Main Image Area -->
  <div class="image-workspace">
  <!-- Unified Toolbar -->
  <app-unified-toolbar
    *ngIf="activeConfig().showToolbar"
    [enabledTools]="enabledTools()"
    [activeTool]="currentTool()"
    [position]="activeConfig().toolbarPosition || 'top'"
    [showSymbolPalette]="showSymbolPalette()"
    (toolClicked)="onToolbarToolClick($event)"
    (symbolPaletteToggled)="toggleSymbolPalette()"
  ></app-unified-toolbar>
    <!-- Image Container -->
    <div #imageContainer class="image-container">
      <div #zoomOuter class="zoom-outer">
        <div #zoomElement class="zoom-element">
          <img 
            #imageElement
            [src]="'http://localhost:8082/' + pngUrl()"
            [alt]="imageName()"
            class="main-image"
            (wheel)="onWheel($event)"
            (mouseleave)="onMouseLeave($event)"
            (mousedown)="onMouseDown($event)"
            (mousemove)="onMouseMove($event)"
            (mouseup)="onMouseUp($event)"

            [style.cursor]="cursor"
          />
          <canvas 
            #canvasElement
            class="shape-canvas">
          </canvas>
        </div>
      </div>
    </div>
  </div>

  <app-context-menu
    [isVisible]="contextMenu.visible"
    [position]="{ x: contextMenu.x, y: contextMenu.y }"
    [actions]="contextMenu.actions"
    [selectedItem]="contextMenu.selectedItem"
    (closeMenu)="closeContextMenu()"
    (actionSelected)="handleContextMenuAction($event)">
  </app-context-menu>

  <!-- Hidden file input for image conversion -->
  <input 
    #shapeImageInput
    type="file"
    accept="image/*"
    (change)="onShapeImageSelected($event)"
    style="display: none"
  />
</div>
