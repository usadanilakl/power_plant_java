<form [formGroup]="form" (ngSubmit)="onSubmit()" [class]="'form-layout-' + layout">
  @for (field of fields; track field.name) {
    <div [class]="'form-field-layout-' + layout">
      @switch (field.type) {
        @case ('select') {
          <app-searchable-dropdown
            [label]="field.label"
            [options]="field.options"
            [formControlName]="field.name">
          </app-searchable-dropdown>
        }
        @case ('checkbox-group') {
          <app-checkbox-group
            [label]="field.label"
            [options]="field.options"
            [formControlName]="field.name">
          </app-checkbox-group>
        }
        @default {
          <app-form-input
            [label]="field.label"
            [type]="field.type"
            [formControlName]="field.name">
          </app-form-input>
        }
      }
    </div>
  }
  
  <div [class]="'form-field-layout-' + layout">
    <button type="submit">Submit</button>
    @if (formDelete.observed) {
      <button type="button" (click)="onDelete()">Delete</button>
    }
  </div>
</form>
