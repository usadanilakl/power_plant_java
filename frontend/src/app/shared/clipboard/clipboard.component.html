<div class="clipboard-wrapper">
  <!-- Collapsed Icon View -->
  <div
    *ngIf="!isExpanded()"
    class="clipboard-icon-wrapper"
    [style.right.px]="iconPosition().x"
    [style.bottom.px]="iconPosition().y"
    (mousedown)="onDragStart($event, 'icon')"
    (click)="onIconClick()"
  >
    <div
      class="clipboard-icon-button"
      [matTooltip]="'Clipboard (' + totalItemCount() + ' items)'"
    >
      <mat-icon>assignment</mat-icon>
      <span class="item-badge" *ngIf="totalItemCount() > 0">{{ totalItemCount() }}</span>
    </div>
  </div>

  <!-- Expanded Clipboard View -->
  <div
    *ngIf="isExpanded()"
    class="clipboard-container"
    [style.right.px]="windowPosition().x"
    [style.bottom.px]="windowPosition().y"
  >
    <div
      class="clipboard-header"
      (mousedown)="onDragStart($event, 'window')"
    >
      <div class="drag-handle">
        <mat-icon>drag_indicator</mat-icon>
      </div>
      <h3>Clipboard</h3>
      <button class="close-button" (click)="toggleClipboard()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="clipboard-content">
      <!-- Sections Tabs -->
      <div class="sections-tabs">
        <button
          *ngFor="let section of sections()"
          [class.active]="activeSection()?.id === section.id"
          (click)="setActiveSection(section.id)"
          class="section-tab"
        >
          {{ section.name }}
          <span class="section-count">({{ section.items.length }})</span>
        </button>
      </div>

      <!-- Active Section Items -->
      <div class="section-items" *ngIf="activeSection()">
        <div class="section-actions">
          <button
            (click)="clearSection(activeSection()!.id)"
            class="action-button"
            [disabled]="activeSection()!.items.length === 0"
          >
            <mat-icon>delete_sweep</mat-icon>
            Clear
          </button>
          <button
            (click)="deleteSection(activeSection()!.id)"
            class="action-button"
          >
            <mat-icon>delete</mat-icon>
            Delete Section
          </button>
        </div>

        <div class="items-list">
          <div
            *ngFor="let item of activeSection()!.items; let i = index"
            class="clipboard-item"
            (click)="openItemDialog(item)"
          >
            <div class="item-summary">
              <span class="item-title">{{ getItemSummary(item) }}</span>
            </div>
            <div class="item-actions" (click)="$event.stopPropagation()">
              <button
                (click)="copyToClipboard(item)"
                class="item-action-button"
                matTooltip="Copy to system clipboard"
              >
                <mat-icon>content_copy</mat-icon>
              </button>
              <button
                (click)="removeItem(activeSection()!.id, i)"
                class="item-action-button"
                matTooltip="Remove from clipboard"
              >
                <mat-icon>close</mat-icon>
              </button>
            </div>
          </div>

          <div *ngIf="activeSection()!.items.length === 0" class="empty-state">
            <mat-icon>inbox</mat-icon>
            <p>No items in this section</p>
          </div>
        </div>
      </div>

      <div *ngIf="!activeSection()" class="empty-state">
        <mat-icon>inbox</mat-icon>
        <p>No sections yet</p>
      </div>
    </div>
  </div>

  <!-- Item Detail Dialog -->
  <div *ngIf="showItemDialog()" class="item-dialog-overlay" (click)="closeItemDialog()">
    <div class="item-dialog" (click)="$event.stopPropagation()">
      <div class="item-dialog-header">
        <h4>{{ getItemSummary(selectedItem()) }}</h4>
        <button class="close-button" (click)="closeItemDialog()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <div class="item-dialog-content">
        <div class="item-properties">
          <div
            *ngFor="let prop of getFormattedItemProperties(selectedItem())"
            class="property-row"
            [class.nested]="prop.isNested"
          >
            <span class="property-label">{{ prop.key }}</span>
            <span class="property-value">{{ prop.value }}</span>
          </div>
        </div>
      </div>
      <div class="item-dialog-actions">
        <button class="dialog-button" (click)="copyToClipboard(selectedItem())">
          <mat-icon>content_copy</mat-icon>
          Copy JSON
        </button>
        <button class="dialog-button secondary" (click)="closeItemDialog()">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
