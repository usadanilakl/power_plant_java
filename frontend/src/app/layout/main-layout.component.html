    <div class="layout-container">
      <header class="header">
        @if (header()) {
          <h1>{{ header() }}</h1>
        } @else {
          <h1>Jackson Generation</h1>  
        }
        <ng-content select="[header]"></ng-content>
        <button class="toggle-menu-btn" (click)="toggleMenu()">Toggle Menu</button>
      </header>
    
      <div class="content-wrapper">
        <nav class="left-menu" id="leftMenu" #leftMenu [style.width.px]="menuWidth">
          <ng-content select="[left-menu]"></ng-content>
        </nav>
        <div class="resizer" id="resizer" #resizer (mousedown)="onResizerMouseDown($event)"></div>
        <main class="main-content" #mainContent>
          <ng-content select="[main-content]"></ng-content>
        </main>
      </div>
    </div>
