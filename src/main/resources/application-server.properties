######################################################################################
# SERVER Profile - IIS reverse proxy deployment
# Activate with: spring.profiles.active=prod,hub,server
######################################################################################
server.port=8085

# Trust X-Forwarded-* headers from IIS reverse proxy
server.forward-headers-strategy=NATIVE
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# Public-facing URL (used for email links like password reset)
app.external-url=https://jgportal.jpowerusa.com
