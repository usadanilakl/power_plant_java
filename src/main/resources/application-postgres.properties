######################################################################################
# PostgreSQL Profile - Add 'postgres' to active profiles to switch hub from H2 to PG
# Example: spring.profiles.active=prod,hub,server,postgres
######################################################################################

# PostgreSQL datasource (overrides H2 from prod profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/power_plant
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PG_USERNAME:power_plant}
spring.datasource.password=${PG_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable H2 console
spring.h2.console.enabled=false

# PostgreSQL connection pool — handles more concurrent connections than H2
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL-specific Hibernate tuning
spring.jpa.properties.hibernate.order_updates=true

# Use PostgreSQL-compatible schema file
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
