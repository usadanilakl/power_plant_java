<div class="printable-form-designer">
  <div class="top-menu">
    <div class="control-group sheet-size-controls">
      <label>Sheet Size:</label>
      <input type="number" [(ngModel)]="sheetWidth" (change)="updateSheetSize(sheetWidth(), sheetHeight())" title="Sheet Width">
      <span>x</span>
      <input type="number" [(ngModel)]="sheetHeight" (change)="updateSheetSize(sheetWidth(), sheetHeight())" title="Sheet Height">
    </div>

    <button (click)="formState.copyPage()">Copy Page</button>
    <button (click)="formState.deletePage()">Delete Page</button>

    <app-zoom-controls
      class="zoom-controls-container"
      [scale]="formScale()"
      (zoomIn)="zoomIn()"
      (zoomOut)="zoomOut()"
      (fitToPanel)="fitToPanel()">
    </app-zoom-controls>

    <app-page-navigator></app-page-navigator>
  </div>

  <div class="main-content">
    <div class="left-panel">
      <div class="tools-menu">
        <div class="control-group">
          <button (click)="addContainer()" title="Add Container">Add</button>
          <button (click)="formState.copySelectedContainers()" title="Duplicate">Duplicate</button>
          <button (click)="deleteContainer()" title="Delete Selected">Delete</button>
        </div>

        <div class="control-group">
          <button (click)="groupSelection()" title="Group Selected">Group</button>
          <button (click)="ungroupSelection()" title="Ungroup Selection">Ungroup</button>
        </div>

        <div class="control-group alignment-controls">
          <h4 class="group-title">Align</h4>
          <div class="button-row">
            <button (click)="alignContainers('left')" title="Align Left">Left</button>
            <button (click)="alignContainers('h-center')" title="Align Horizontal Center">Center</button>
            <button (click)="alignContainers('right')" title="Align Right">Right</button>
            <button (click)="swapContainers()" title="Swap Places">Swap</button>
          </div>
          <div class="button-row">
            <button (click)="alignContainers('top')" title="Align Top">Top</button>
            <button (click)="alignContainers('v-center')" title="Align Vertical Center">Middle</button>
            <button (click)="alignContainers('bottom')" title="Align Bottom">Bottom</button>
          </div>

          <h4 class="group-title">Match Size</h4>
          <div class="button-row">
            <button (click)="matchSize('width')" title="Match Width">Width</button>
            <button (click)="matchSize('height')" title="Match Height">Height</button>
            <button (click)="matchSize('both')" title="Match Width & Height">Both</button>
          </div>

          <h4 class="group-title">Distribute</h4>
          <div class="button-row">
            <button (click)="distributeContainers('horizontal')" title="Distribute Horizontally">Horizontal</button>
            <button (click)="distributeContainers('vertical')" title="Distribute Vertically">Vertical</button>
          </div>

          <h4 class="group-title">Arrange</h4>
          <div class="button-row">
            <button (click)="arrangeSequentially('horizontal')" title="Arrange Horizontally">Horizontal</button>
            <button (click)="arrangeSequentially('vertical')" title="Arrange Vertically">Vertical</button>
          </div>
        </div>
      </div>
    </div>

    <div class="center-panel" #centerPanel>
      <div class="form-container" #designArea [ngStyle]="getFormContainerStyle()">
        <div class="grid-background"></div>

        @if (stateService.selectionBox(); as box) {
          <div class="selection-box"
            [style.left.px]="box.x"
            [style.top.px]="box.y"
            [style.width.px]="box.width"
            [style.height.px]="box.height">
          </div>
        }

        <div class="form-content" #formContent (mousedown)="onFormSheetMouseDown($event)">
          @for (container of containers(); track container.id; let i = $index) {
            <div
              class="draggable-container"
              [ngStyle]="getContainerStyles(container)"
              [class.selected]="isContainerSelected(container)"
              [class.locked]="container.locked"
              [class.hovered]="formState.isContainerHovered(container)"
              (mousedown)="onDragStart($event, container)"
              (click)="selectContainer(container, $event)"
              (contextmenu)="viewPropertiesOfContainer(container, $event)">

              <app-container-renderer [container]="container"></app-container-renderer>

              <div class="resize-handle bottom-right" (mousedown)="startResize($event, i)"></div>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="right-panel">
      <app-container-list
        (rightClickEvent)="viewPropertiesOfContainer($event.container, $event.event)">
      </app-container-list>
    </div>
  </div>
</div>

<app-floating-menu
  [title]="'Container Properties'"
  [position]="menuPosition.BottomLeft"
  [open]="isPropertiesPopupOpen()"
  (close)="closePropertiesPopup()">
  <app-container-properties
    [container]="formState.propertiesOfContainer()"
    [availableFields]="availableFields()"
    (deleteContainerEvent)="deleteContainer($event)">
  </app-container-properties>
</app-floating-menu>
