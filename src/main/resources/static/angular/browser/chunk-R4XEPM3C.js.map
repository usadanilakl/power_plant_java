@if (isOpen) {
  <div class="popup-overlay" [style.z-index]="zIndex" (click)="onClose()">
    <div class="popup-content" [ngClass]="['popup-' + size, fullHeight ? 'popup-full-height' : '']" (click)="$event.stopPropagation()">
      <div class="popup-header">
        <h2>{{ title }}</h2>
        <button (click)="onClose()" class="close-button">&times;</button>
      </div>
      <div class="popup-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
