<div class="invisible-multi-select-container" cdkOverlayOrigin #trigger="cdkOverlayOrigin" (click)="toggleDropdown($event)">
  <div class="display-area" [class.disabled]="disabled" [class.placeholder]="!displayValue">
    <span class="display-value">
      {{ displayValue || '     ' }}
    </span>
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen"
    [cdkConnectedOverlayPositions]="positions"
    (overlayOutsideClick)="closeDropdown()">
    <div class="dropdown-panel" (click)="$event.stopPropagation()">
      <div class="search-container">
        <input type="text" class="search-input" (input)="onSearch($event)" placeholder="Search..." autofocus>
      </div>
      <ul class="options-list">
        @for (option of filteredAndSortedOptions; track option.value) {
          <li class="option-item" (click)="toggleOption(option, $event)" [class.selected]="isSelected(option)">
            <span class="option-label">{{ option.label }}</span>
          </li>
        } @empty {
          <li class="no-options">No options found</li>
        }
      </ul>
      <div class="dropdown-actions">
        <button type="button" class="action-button" (click)="onAddNewOption($event)">Add New</button>
        <button type="button" class="action-button" (click)="onEditOption($event)">Edit</button>
      </div>
    </div>
  </ng-template>
</div>
