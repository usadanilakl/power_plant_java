<div class="square-radio-group">
  <label *ngFor="let option of options(); let i = index">
    <input
      type="radio"
      [name]="name()"
      [value]="option"
      [checked]="value === option"
      (change)="selectOption(option)"
      [disabled]="disabled"
    />
    <span class="custom-square"></span>
  </label>
</div>
