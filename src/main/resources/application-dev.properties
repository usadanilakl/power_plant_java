######################################################################################
# DEV Profile - Development Database
######################################################################################
spring.datasource.url=jdbc:h2:file:./db/devdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;LOCK_TIMEOUT=10000;RETENTION_TIME=5000;TRACE_MAX_FILE_SIZE=16

######################################################################################
# DEV Profile - File Storage
######################################################################################
files.root.path=${user.dir}${file.separator}uploads-dev
files.relative.path=uploads-dev

######################################################################################
# DEV Profile - E2E Test Harness
######################################################################################
# Exposes /api/auth/admin/users/{id}/pin/set-test and /pin/unlock so the e2e
# harness can provision deterministic test users. NEVER enable in prod.
e2e.test-endpoints.enabled=true
