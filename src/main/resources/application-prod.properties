######################################################################################
# PROD Profile - Production Database
######################################################################################
spring.datasource.url=jdbc:h2:file:./db/proddb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;LOCK_TIMEOUT=10000;RETENTION_TIME=5000;TRACE_MAX_FILE_SIZE=16

######################################################################################
# PROD Profile - File Storage
######################################################################################
files.root.path=${user.dir}${file.separator}uploads-prod
files.relative.path=uploads-prod

######################################################################################
# PROD Profile - EtaPro (desktop-only, requires Excel + COM on the machine)
######################################################################################
etapro.enabled=true
# REST API is the primary history source on the plant desktop (base-url/server/zone are in
# application.properties). Falls back to the Excel scraper automatically if a call fails.
etapro.api.enabled=true

######################################################################################
# PROD Profile - Sync reliability flags (staged enablement — test one stage at a time)
######################################################################################
# Phase 2 (2026-08-07): bisect-on-rollback. On a batch rollback, re-apply each half in its own
# transaction so a single poison change (e.g. a constraint violation) is isolated and does NOT
# charge / eventually dead-letter its healthy batch-mates. Applies on hub AND client (both run the
# apply path). Default OFF; enabled here for staged testing. Rollback = set false + rebuild/restart.
sync.apply.bisect-on-rollback-enabled=true
# Phase 4 (2026-08-07): M2M membership OR-Set. Owning @ManyToMany membership (LotoStandard.lotoPoints,
# Equipment.lotoPoints, LotoPoint.pictures) applies as an LWW-Element-Set instead of whole-set
# DELETE-all-then-INSERT, so concurrent edits converge instead of clobbering. Enabled AFTER a verified
# drift=zero baseline (done 2026-08-07). On the FIRST startup with this flag, MembershipSeedService
# seeds membership_event from the (converged) join tables — one baseline ADD per join row (~22k rows
# for eq_loto_point), so that first boot is a bit slower; subsequent boots skip it (marker-guarded).
# Both nodes seed identical events because the baseline key is deterministic. Rollback = false + rebuild.
sync.membership.orset.enabled=true
