######################################################################################
# TEST Profile - Test Database
######################################################################################
spring.datasource.url=jdbc:h2:file:./db/testdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;LOCK_TIMEOUT=10000

######################################################################################
# TEST Profile - File Storage
######################################################################################
files.root.path=${user.dir}${file.separator}uploads-test
files.relative.path=uploads-test

######################################################################################
# TEST Profile - Cleanup on Startup (set to false to disable)
######################################################################################
test.cleanup.enabled=true
test.cleanup.database-path=${user.dir}/db/testdb.mv.db
test.cleanup.uploads-path=${user.dir}/uploads-test

######################################################################################
# TEST Profile - E2E Test UI (enables /e2e-test page in Angular frontend)
######################################################################################
test.ui.enabled=true
