######################################################################################
# TEST Profile - Test Database
######################################################################################
spring.datasource.url=jdbc:h2:file:./db/testdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;LOCK_TIMEOUT=10000;RETENTION_TIME=5000;TRACE_MAX_FILE_SIZE=16

######################################################################################
# TEST Profile - File Storage
######################################################################################
files.root.path=${user.dir}${file.separator}uploads-test
files.relative.path=uploads-test

######################################################################################
# TEST Profile - Cleanup on Startup (set to false to disable)
######################################################################################
test.cleanup.enabled=true
test.cleanup.database-path=${user.dir}/db/testdb.mv.db
test.cleanup.uploads-path=${user.dir}/uploads-test

######################################################################################
# TEST Profile - E2E Test UI (enables /e2e-test page in Angular frontend)
######################################################################################
test.ui.enabled=true
e2e.test-endpoints.enabled=true

# EtaPro scraper (desktop-only feature)
etapro.enabled=true

######################################################################################
# TEST Profile - AIRGAP
#
# Everything below severs this profile from production. The base application.properties
# ships sync.server.enabled=true pointed at the live hub and spring.profiles.include=secrets,
# so WITHOUT these overrides a @SpringBootTest reaches the real hub, mailbox, and Supabase.
#
# Credentials are blanked rather than merely disabled: SharePointConfig, EmailConfig,
# the Maximo beans, NgAgentController and the Supabase services are all
# @ConditionalOnProperty on these keys, so a blank value means the bean never registers
# and the integration cannot fire even if a test calls into it by mistake.
#
# Do not "fix" a failing test by re-enabling one of these. Mock the collaborator instead.
######################################################################################

# --- Sync: never talk to the hub from a test -----------------------------------------
sync.server.enabled=false
sync.server.url=
sync.discovery.enabled=false
sync.auto-resync.enabled=false
sync.backup.enabled=false

# --- Credentials: blank => @ConditionalOnProperty beans do not register --------------
sharepoint.azure.client-id=
maximo.api-key=
gemini.api.key=
supabase.url=
onlocation.api.key=
email.graph.from=

# --- Outbound integrations -----------------------------------------------------------
sharepoint.sync.enabled=false
etapro.api.enabled=false
schedule.pto.intake.enabled=false
schedule.pto.notify.enabled=false
schedule.v2.enabled=false

# Power Automate fallback URLs (the base file ships a live inventory flow URL).
pa.flow.work-request-url=
pa.flow.jha-url=
pa.flow.confined-space-url=
pa.flow.instrument-url=
pa.flow.instrument-log-url=
pa.flow.field-list-url=
pa.flow.inventory-url=
pa.flow.sds-url=
pa.flow.qualifications-url=

# --- Desktop automation: do not drive the GUI from a test ----------------------------
redtag.automation.enabled=false

# --- Keep writes off the J: network share --------------------------------------------
h2.backup.directory=${user.dir}/h2-backups-test
h2.backup.shared.directory=${user.dir}/h2-backups-test/shared
sync.backup.file.directory=${user.dir}/h2-backups-test/files
