######################################################################################
# HUB Profile - Hub-Peer Sync Server
# Activate with: spring.profiles.active=prod,hub
# For PostgreSQL: spring.profiles.active=prod,hub,server,postgres
######################################################################################
server.port=8090

sync.role=hub
sync.server.enabled=false

######################################################################################
# Sync hub durability flags (Inc 6/7). Both default OFF so the code paths are inert
# until deliberately turned on PER-HUB in the field — no redeploy needed to revert.
#
# sync.hub.apply-lww-enabled (Inc 6): the hub applies incoming changes under real
#   Last-Writer-Wins instead of blindly applying, so an older concurrent change can no
#   longer overwrite a newer value already on the hub.
#
# sync.hub.durable-apply-state-enabled (Inc 7): the hub records each change's apply
#   outcome in hub_change_apply_state (co-committed with the entity), so an apply failure
#   survives a restart and is recovered by a rescan (timer + startup) instead of an
#   in-memory queue a reboot wipes. PRE-FLIGHT before turning ON: confirm the apply
#   ledger-totality counter is 0 in a soak (log key: sync.apply.totality_gap) with
#   apply-lww-enabled=true, and drain any pending in-memory retries first.
#
# durable-apply-state REQUIRES apply-lww-enabled=true: without it the durable path stays INERT
#   (logged at ERROR) because a rescan re-apply under LWW-off could overwrite a newer value.
#
# sync.hub.log-compaction-enabled (retention fix): keep ONLY the latest FieldChange per
#   (entityType,entityId,fieldName), deleting superseded rows nightly. Then any offline node
#   catches up by a normal incremental pull (no retention gap) and high-churn fields collapse to
#   one row. When ON, it OWNS FieldChange retention and the age-prune (retention-days) yields to it.
#   REQUIRES durable-apply-state-enabled=true (it gates each delete on the replacement being durably
#   applied) — INERT + ERROR-logged otherwise. Phase 1 compacts real fields only; _entity_ markers
#   are left untouched. retention-days is kept as a dormant knob (re-enables age-pruning if compaction
#   is turned off). Compaction removes rows but H2 never shrinks its file on delete — reclaim physical
#   space with the SHUTDOWN DEFRAG tooling (scripts/database/compact-database.bat) on a maintenance window.
#   Cadence: sync.hub.compaction-cron (default '0 45 3 * * ?' = nightly 03:45). Raise the frequency on a
#   high-churn hub (e.g. '0 0 * * * ?' hourly) so terminal-good superseded rows collapse sooner than once
#   a day — each run is a full candidate scan over FIELD_CHANGE, so this is a table-scan cost, not free.
#   Inline (delete-on-apply) compaction was deliberately rejected — see FieldChangeCompactor.scheduledCompaction.
# Tunables (defaults shown): apply-max-attempts=15 (FAILED_RETRYABLE budget),
#   deferred-max-age-minutes=1440 (DEFERRED age-out — a slow parent must not dead-letter
#   its child), rescan-page-size=200, reconcile-window-hours=96 (>= the 3-day FieldChange
#   retention so a flag-flip reconcile covers all retained changes), apply-state-retention-days=7,
#   pending-max-age-hours=72 (PENDING give-up valve — a change re-applied for this long that STILL
#   yields no disposition is a ledger-totality gap that never resolves; kept >> deferred-max-age, and it
#   only fires on rows already attempted so a crash-before-apply row is retried, never dead-lettered first),
#   startup-grace-minutes=60 (after boot, NO give-up valve runs for this long — the age windows are
#   wall-clock and don't pause during downtime, so a long outage must not dead-letter parent-waiting /
#   unresolved changes before they are retried and clients reconnect to re-send parents; retry still runs).
# The rescan now processes eligible rows least-recently-attempted first (fairness) so a large orphan
#   backlog drains fully instead of the same first page being re-ground every cycle. Ops: bulk-clear a
#   KNOWN-stale orphan backlog with POST /ng/admin/sync-queue/deadletter-orphans?entityType=ShiftDay&olderThanHours=1
#   (allow-listed types only; clears ATTEMPTED stuck rows — run after the hub has been up a few minutes so
#   the fairness rescan has attempted the backlog, or just let the rescan + valves drain it on their own).
######################################################################################
sync.hub.apply-lww-enabled=true
sync.hub.durable-apply-state-enabled=true
sync.hub.log-compaction-enabled=true

# Disable open-in-view on hub. Without this, every HTTP request holds a DB connection
# for its entire duration. Slow endpoints (WR heal, sync exchange, backup) hold connections
# for minutes, exhausting the pool and triggering connection leak detection.
# All hub code uses explicit @Transactional or TransactionTemplate — no lazy loading
# depends on the request-scoped EntityManager.
spring.jpa.open-in-view=false

# Hub automatically polls SharePoint
sharepoint.sync.enabled=true

# Hub sync settings
sync.hub.retention-days=3
sync.hub.batch-size=500
sync.hub.compaction-enabled=true

# Update distribution
electron-update.directory=${user.dir}/electron-updates
update.jar.directory=${user.dir}/updates
resource-packs.base-path=${user.dir}/resource-packs

# Backup & resync
sync.backup.storage-path=./backup-storage
sync.backup.max-backups=5
sync.backup.cache-duration-minutes=5
sync.backup.max-old-backups=3
sync.import.temp-dir=${user.dir}/sync-import-tmp
sync.import.max-file-size=524288000

# Chunked file uploads need at least 150MB (chunks are 100MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

######################################################################################
# EtaPro is DESKTOP-ONLY. Hub runs headless on Linux-style servers with no Excel,
# no Windows COM, and no PowerShell environment. EtaPro beans use
# @ConditionalOnProperty("etapro.enabled"=true), so setting it false here keeps every
# scraper bean from loading on the hub. NOTE: the JPA entities (EtaProLogEntry,
# EtaProReading, EtaProScrapeJob, EtaProPoint) are unconditional @Entity classes, so
# their tables ARE created on the hub via ddl-auto — that is required, because the hub
# stores rows synced up from desktops. Do not add profile guards to the entities.
######################################################################################
etapro.enabled=false
