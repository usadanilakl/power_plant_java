<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="token" name="_csrf" th:content="${_csrf.token}"/>
    <title>Database Backup and Restore</title>
    <link rel="stylesheet" href="/bootstrap-5.3.3-dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Database Backup and Restore</h1>

        <!-- Backup Form -->
        <div class="card mb-4">
            <div class="card-header">Backup Database</div>
            <div class="card-body">
                <form id="backupForm">
                    <div class="mb-3">
                        <label for="backupFileName" class="form-label">Backup File Name (optional)</label>
                        <input type="text" class="form-control" id="backupFileName" name="backupFileName">
                    </div>
                    <button type="submit" class="btn btn-primary">Create Backup</button>
                </form>
            </div>
        </div>

        <!-- List of Backups and Restore Options -->
        <div class="card">
            <div class="card-header">Available Backups</div>
            <div class="card-body">
                <ul id="backupList" class="list-group">
                    <!-- Backup files will be listed here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Warning Modal -->
    <div class="modal fade" id="warningModal" tabindex="-1" aria-labelledby="warningModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="warningModalLabel">Warning</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to restore the database? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmRestore">Restore</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>

    <script>
        let selectedBackupFile = '';
        const warningModal = new bootstrap.Modal(document.getElementById('warningModal'));

        document.addEventListener('DOMContentLoaded', function() {
            // Fetch and display the list of backups
            fetchBackups();

            // Handle backup form submission
            document.getElementById('backupForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const backupFileName = document.getElementById('backupFileName').value;
                createBackup(backupFileName);
            });

            // Handle restore confirmation
            document.getElementById('confirmRestore').addEventListener('click', function() {
                restoreDatabase(selectedBackupFile);
                warningModal.hide();
            });
        });

        function fetchBackups() {
            fetch('/api/backup/list-backups')
                .then(response => response.json())
                .then(backups => {
                    const backupList = document.getElementById('backupList');
                    backupList.innerHTML = '';
                    backups.forEach(backup => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item d-flex justify-content-between align-items-center';
                        li.textContent = backup;
                        
                        const restoreButton = document.createElement('button');
                        restoreButton.className = 'btn btn-warning btn-sm';
                        restoreButton.textContent = 'Restore';
                        restoreButton.onclick = function() {
                            selectedBackupFile = backup;
                            warningModal.show();
                        };
                        
                        li.appendChild(restoreButton);
                        backupList.appendChild(li);
                    });
                })
                .catch(error => console.error('Error fetching backups:', error));
        }

        function createBackup(backupFileName) {
            const formData = new FormData();
            if (backupFileName) {
                formData.append('backupFileName', backupFileName);
            }

            fetch('/api/backup/backup-database', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
                }
            })
            .then(response => response.text())
            .then(message => {
                alert(message);
                fetchBackups(); // Refresh the backup list
            })
            .catch(error => console.error('Error creating backup:', error));
        }

        function restoreDatabase(backupFileName) {
            const formData = new FormData();
            formData.append('backupFileName', backupFileName);

            fetch('/api/backup/restore-database', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
                }
            })
            .then(response => response.text())
            .then(message => {
                alert(message);
                fetchBackups(); // Refresh the backup list after restore
            })
            .catch(error => console.error('Error restoring database:', error));
        }
    </script>
</body>
</html>
