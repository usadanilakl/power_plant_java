<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="token" name="_csrf" th:content="${_csrf.token}"/>


    <link rel="stylesheet" href="/transfer_to_data_service_porject/page.css">
    <link rel="stylesheet" href="/transfer_to_data_service_porject/FileMenu.css">
    <link rel="stylesheet" href="/transfer_to_data_service_porject/DisplayConflict.css">

</head>
<body>
        <button id="toggle-menu">Toggle Menu</button>
        <div id="menu-container" style="display: none;"></div>

        <main>
            
            <div id="picture-container" class="view" data-file-id="">
                <img src="" usemap="#image_map" id="picture">
                <map name="image_map" id="map"></map>
            </div>
            
        </main>
        <div id="equipmentFormsPopup" class="equipment-forms-popup">
            <div class="equipment-forms-content">
                <span class="close-popup">&times;</span>
                <div id="equipmentFormsContainer" class="equipment-forms-container"></div>
            </div>
        </div>


    <script src="/bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>


    <!-- <script src="/functions/controllers/FileController.js"></script> -->
    <script src="/transfer_to_data_service_porject/Controller.js"></script>


    <!-- <script src="/functions/functions/PictureService.js"></script> -->
    <script src="/transfer_to_data_service_porject/FileMenu.js"></script>
    <script src="/transfer_to_data_service_porject/DisplayPicture.js"></script>
    <script src="/transfer_to_data_service_porject/DisplayConflict.js"></script>
    <script src="/transfer_to_data_service_porject/Shapes.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', async ()=>{


            
            let picture = document.getElementById('picture');
            let pictureContainer = document.getElementById('picture-container');
            let csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');


            // const fileToVerify = await getNextFileToVerify();
            // loadPictureWithFile(fileToVerify);

            pictureContainer.addEventListener('mousedown',(event)=>{
                if(event.button===0){
                    event.preventDefault();
                    relocateHighlightsWithPicture(event);
                }  
            });
            pictureContainer.addEventListener('touchstart',(event)=>{
                if(event.target.tagName === "INPUT") return

                event.preventDefault();
                // relocateHighlightsWithPictureTouch(event);
                relocateHighlightsWithPictureDoubleTap(event);
            });
            const zoom = zoomPicture.bind(null,picture);
            pictureContainer.addEventListener('wheel',zoom);
            pictureContainer.addEventListener('touchstart', zoomPictureTouch);
            document.addEventListener('mousedown',handleMouseDown);

            const menu = await createFileMenu();
            document.getElementById('menu-container').appendChild(menu);

            const toggleButton = document.getElementById('toggle-menu');
            const menuContainer = document.getElementById('menu-container');
            
            toggleButton.addEventListener('click', () => {
                menuContainer.style.display = menuContainer.style.display === 'none' ? 'block' : 'none';
            });

        })


    </script>
</body>
</html>
