<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="token" name="_csrf" th:content="${_csrf.token}"/>
    <style>
        .equipment-form {
            background-color: #f0f0f0;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .equipment-form h2 {
            color: #333;
            margin-bottom: 15px;
        }
        .equipment-field {
            margin-bottom: 10px;
        }
        .equipment-field label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        .equipment-field input {
            width: 250px;
            padding: 5px;
        }
        .loto-points-container {
            background-color: #e0e0e0;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        .loto-point {
            background-color: #fff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 3px;
        }
        .loto-point label {
            display: inline-block;
            width: 140px;
            font-weight: bold;
        }
        .loto-point input {
            width: 200px;
            padding: 3px;
        }
        .button-container {
            margin-top: 15px;
        }
        .button-container button {
            margin-right: 10px;
        }
        .equipment-forms-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
        }

        .equipment-form {
            flex: 0 1 calc(33.333% - 20px);
            min-width: 300px;
            max-width: calc(33.333% - 20px);
            box-sizing: border-box;
        }

        @media (max-width: 1200px) {
            .equipment-form {
                flex: 0 1 calc(50% - 20px);
                max-width: calc(50% - 20px);
            }
        }

        @media (max-width: 768px) {
            .equipment-form {
                flex: 0 1 100%;
                max-width: 100%;
            }
        }
    </style>

</head>
<body>
    <div class="container">

        <main>
            <select id="api-dropdown" class="form-select">
                <option value="">Select Conflict</option>
                <option value="equipment_coordinates">Equipment Coordinates</option>
                <option value="equipment_duplicates">Equipment Duplicates</option>
                <option value="equipment_lp_tag_mismatch">Eq/Lp Tag missmatch</option>
                <option value="unit_equipment_mismatch">U1/U2 description missmatch</option>
                <option value="loto_point_noEq">LP with no equipment</option>
                <option value="loto_point_duplicates">LP Duplicates</option>
                <option value="loto_point_unprocessed">LP Unprocessed</option>
            </select>
            
        </main>


    </div>

    <div id="equipmentFormsContainer" class="equipment-forms-container"></div>

    <script src="/bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', async ()=>{


            document.getElementById('api-dropdown').addEventListener('change', async function() {
                getConflictList(this.value)
            });

        async function getConflictList(selectedValue) {
            if (selectedValue) {
                let apiEndpoint;
                if(selectedValue.includes('equipment'))apiEndpoint = `/conflict/equipment/${selectedValue}`;
                else apiEndpoint = `/conflict/equipment/${selectedValue}`;
                
                try {
                    const response = await fetch(apiEndpoint, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': token // Using the token variable you already have
                        }
                    });
                    const data = await response.json();
                    console.log('API response:', data);
                    // Handle the API response here
                    if(selectedValue.includes('equipment')){
                        data.forEach(e=>{
                            buildEquipmentForm(e);
                        })
                        
                    } else {
                        data.forEach(e=>{
                            buildLotoPointForm(e);
                        })
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }




        let duplicates = [];
        let csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');



        async function getDuplicates(){
            const response = await fetch('/conflict/get-duplicates');
            const data = await response.json();
            duplicates = data;
        }


        /*******************************************************************
         * EQUIPMENT POINT FORM
         * ****************************************************************/

        function buildEquipmentForm(equipment) {
            const form = document.createElement('form');
            form.id = 'equipmentForm_' + equipment.id;
            form.classList.add('equipment-form');

            const title = document.createElement('h2');
            title.textContent = 'Equipment Details';
            form.appendChild(title);

            const equipmentFields = ['tagNumber', 'description', 'specificLocation'];

            // Equipment fields
            equipmentFields.forEach(field => {
                const fieldDiv = document.createElement('div');
                fieldDiv.classList.add('equipment-field');

                const label = document.createElement('label');
                label.htmlFor = `${equipment.id}_${field}`;
                label.textContent = field.charAt(0).toUpperCase() + field.slice(1) + ':';

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `${equipment.id}_${field}`;
                input.name = `equipment.${field}`;
                input.value = equipment[field] || '';

                fieldDiv.appendChild(label);
                fieldDiv.appendChild(input);
                form.appendChild(fieldDiv);
            });

            const fieldDiv = document.createElement('div');
            fieldDiv.classList.add('equipment-field');

            const label = document.createElement('label');
            label.htmlFor = `${equipment.id}_mainFile`;
            label.textContent = 'File Number:';

            const filePath = equipment.files && equipment.files.length > 0 ? equipment.files[0] : '';
            const fileNumber = filePath.substring(filePath.lastIndexOf('/') + 1);

            const input = document.createElement('input');
            input.type = 'text';
            input.id = `${equipment.id}_mainFile`;
            input.name = 'equipment.files[0]';
            input.value = fileNumber;
            input.readOnly = true;

            fieldDiv.appendChild(label);
            fieldDiv.appendChild(input);
            form.appendChild(fieldDiv);

            // Hidden input for equipment ID
            const idInput = document.createElement('input');
            idInput.type = 'hidden';
            idInput.name = 'equipment.id';
            idInput.value = equipment.id || '';
            form.appendChild(idInput);

            // Loto Points
            const lotoPointsContainer = document.createElement('div');
            lotoPointsContainer.id = `lotoPointsContainer_${equipment.id}`;
            lotoPointsContainer.classList.add('loto-points-container');
            
            const lotoPointsTitle = document.createElement('h3');
            lotoPointsTitle.textContent = 'Loto Points';
            lotoPointsContainer.appendChild(lotoPointsTitle);
            
            form.appendChild(lotoPointsContainer);

            const buttonContainer = document.createElement('div');
            buttonContainer.classList.add('button-container');

            const addLotoPointButton = document.createElement('button');
            addLotoPointButton.type = 'button';
            addLotoPointButton.textContent = 'Add Loto Point';
            addLotoPointButton.onclick = () => addLotoPointFields(equipment.id);
            buttonContainer.appendChild(addLotoPointButton);

            const submitButton = document.createElement('button');
            submitButton.type = 'submit';
            submitButton.textContent = 'Update Equipment and Loto Points';
            buttonContainer.appendChild(submitButton);

            form.appendChild(buttonContainer);
        
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const updatedEquipment = {
                    id: formData.get('equipment.id'),
                    tagNumber: formData.get('equipment.tagNumber'),
                    description: formData.get('equipment.description'),
                    specificLocation: formData.get('equipment.specificLocation'),
                    lotoPoints: []
                };
        
                // Collect loto points data
                const lotoPointsData = {};
                for (let [key, value] of formData.entries()) {
                    if (key.startsWith('lotoPoints[')) {
                        const match = key.match(/lotoPoints\[(\d+)\]\.(.+)/);
                        if (match) {
                            const index = match[1];
                            const field = match[2];
                            if (!lotoPointsData[index]) {
                                lotoPointsData[index] = {};
                            }
                            lotoPointsData[index][field] = value;
                        }
                    }
                }
        
                updatedEquipment.lotoPoints = Object.values(lotoPointsData);
        
                try {
                    const response = await fetch('/conflict/update-equipment/'+document.getElementById('api-dropdown').value, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': csrfToken
                        },
                        body: JSON.stringify(updatedEquipment)
                    });
        
                    if (response.ok) {
                        const result = await response.json();
                        console.log('Equipment and Loto Points updated:', result);
                        // alert('Equipment and Loto Points updated successfully!');
                        form.remove();    
                        let forms = document.querySelectorAll('.equipment-form');
                        if (forms.length === 0) {
                            const dropdown = document.getElementById('api-dropdown');
                            if (dropdown.value) {
                                await getConflictList(dropdown.value);
                            }
                        }
                    } else {
                        throw new Error('Failed to update equipment and loto points');
                    }
                } catch (error) {
                    console.error('Error updating equipment and loto points:', error);
                    alert('Failed to update equipment and loto points. Please try again.');
                }
            });

            document.getElementById('equipmentFormsContainer').appendChild(form);

            if (equipment.lotoPoints && equipment.lotoPoints.length > 0) {
                equipment.lotoPoints.forEach((lotoPoint, index) => {
                    addLotoPointFields(equipment.id, lotoPoint, index);
                });
            }
        }
        
        function addLotoPointFields(equipmentId, lotoPoint = {}, index = Date.now()) {
            const container = document.getElementById(`lotoPointsContainer_${equipmentId}`);
            const lotoPointDiv = document.createElement('div');
            lotoPointDiv.classList.add('loto-point');
        
            const fields = ['id', 'tagNumber', 'description', 'specificLocation', 'normalPosition', 'isolatedPosition'];
        
            fields.forEach(field => {
                if (field !== 'id') {
                    const fieldDiv = document.createElement('div');
                    fieldDiv.classList.add('loto-point-field');
        
                    const label = document.createElement('label');
                    label.htmlFor = `lotoPoint_${field}_${index}`;
                    label.textContent = field.charAt(0).toUpperCase() + field.slice(1) + ':';
        
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `lotoPoint_${field}_${index}`;
                    input.name = `lotoPoints[${index}].${field}`;
                    input.value = lotoPoint[field] || '';
        
                    fieldDiv.appendChild(label);
                    fieldDiv.appendChild(input);
                    lotoPointDiv.appendChild(fieldDiv);
                } else {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = `lotoPoints[${index}].${field}`;
                    input.value = lotoPoint[field] || '';
                    lotoPointDiv.appendChild(input);
                }
            });
        
            const removeButton = document.createElement('button');
            removeButton.type = 'button';
            removeButton.textContent = 'Remove';
            removeButton.onclick = () => lotoPointDiv.remove();
            lotoPointDiv.appendChild(removeButton);
        
            container.appendChild(lotoPointDiv);
        }




        /*******************************************************************
         * LOTO POINT FORM
         * ****************************************************************/

         function buildLotoPointForm(lotoPoint) {
             const form = document.createElement('form');
             form.id = 'lotoPointForm_' + lotoPoint.id;
             form.classList.add('loto-point-form');
         
             const title = document.createElement('h2');
             title.textContent = 'Loto Point Details';
             form.appendChild(title);
         
             const lotoPointFields = ['tagNumber', 'description', 'specificLocation', 'normalPosition', 'isolatedPosition'];
         
             // Loto Point fields
             lotoPointFields.forEach(field => {
                 const fieldDiv = document.createElement('div');
                 fieldDiv.classList.add('loto-point-field');
         
                 const label = document.createElement('label');
                 label.htmlFor = `${lotoPoint.id}_${field}`;
                 label.textContent = field.charAt(0).toUpperCase() + field.slice(1).replace(/([A-Z])/g, ' $1').trim() + ':';
         
                 const input = document.createElement('input');
                 input.type = 'text';
                 input.id = `${lotoPoint.id}_${field}`;
                 input.name = `lotoPoint.${field}`;
                 input.value = lotoPoint[field] || '';
         
                 fieldDiv.appendChild(label);
                 fieldDiv.appendChild(input);
                 form.appendChild(fieldDiv);
             });
         
             // Hidden input for loto point ID
             const idInput = document.createElement('input');
             idInput.type = 'hidden';
             idInput.name = 'lotoPoint.id';
             idInput.value = lotoPoint.id || '';
             form.appendChild(idInput);
         
             // Associated Equipment
             const equipmentContainer = document.createElement('div');
             equipmentContainer.id = `equipmentContainer_${lotoPoint.id}`;
             equipmentContainer.classList.add('equipment-container');
             
             const equipmentTitle = document.createElement('h3');
             equipmentTitle.textContent = 'Associated Equipment';
             equipmentContainer.appendChild(equipmentTitle);
             
             form.appendChild(equipmentContainer);
         
             const buttonContainer = document.createElement('div');
             buttonContainer.classList.add('button-container');
         
             const addEquipmentButton = document.createElement('button');
             addEquipmentButton.type = 'button';
             addEquipmentButton.textContent = 'Add Equipment';
             addEquipmentButton.onclick = () => addEquipmentFields(lotoPoint.id);
             buttonContainer.appendChild(addEquipmentButton);
         
             const submitButton = document.createElement('button');
             submitButton.type = 'submit';
             submitButton.textContent = 'Update Loto Point and Equipment';
             buttonContainer.appendChild(submitButton);
         
             form.appendChild(buttonContainer);
         
             form.addEventListener('submit', async (e) => {
                 e.preventDefault();
                 const formData = new FormData(form);
                 const updatedLotoPoint = {
                     id: formData.get('lotoPoint.id'),
                     tagNumber: formData.get('lotoPoint.tagNumber'),
                     description: formData.get('lotoPoint.description'),
                     specificLocation: formData.get('lotoPoint.specificLocation'),
                     normalPosition: formData.get('lotoPoint.normalPosition'),
                     isolatedPosition: formData.get('lotoPoint.isolatedPosition'),
                     equipment: []
                 };
         
                 // Collect equipment data
                 const equipmentData = {};
                 for (let [key, value] of formData.entries()) {
                     if (key.startsWith('equipment[')) {
                         const match = key.match(/equipment\[(\d+)\]\.(.+)/);
                         if (match) {
                             const index = match[1];
                             const field = match[2];
                             if (!equipmentData[index]) {
                                 equipmentData[index] = {};
                             }
                             equipmentData[index][field] = value;
                         }
                     }
                 }
         
                 updatedLotoPoint.equipment = Object.values(equipmentData);
         
                 try {
                     const response = await fetch('/conflict/update-loto-point', {
                         method: 'POST',
                         headers: {
                             'Content-Type': 'application/json',
                             'X-CSRF-TOKEN': csrfToken
                         },
                         body: JSON.stringify(updatedLotoPoint)
                     });
         
                     if (response.ok) {
                         const result = await response.json();
                         console.log('Loto Point and Equipment updated:', result);
                         form.remove();    
                         let forms = document.querySelectorAll('.loto-point-form');
                         if (forms.length === 0) {
                             const dropdown = document.getElementById('api-dropdown');
                             if (dropdown.value) {
                                 await getConflictList(dropdown.value);
                             }
                         }
                     } else {
                         throw new Error('Failed to update loto point and equipment');
                     }
                 } catch (error) {
                     console.error('Error updating loto point and equipment:', error);
                     alert('Failed to update loto point and equipment. Please try again.');
                 }
             });
         
             document.getElementById('equipmentFormsContainer').appendChild(form);
         
             if (lotoPoint.equipment && lotoPoint.equipment.length > 0) {
                 lotoPoint.equipment.forEach((equipment, index) => {
                     addEquipmentFields(lotoPoint.id, equipment, index);
                 });
             }
         }
         
         function addEquipmentFields(lotoPointId, equipment = {}, index = Date.now()) {
             const container = document.getElementById(`equipmentContainer_${lotoPointId}`);
             const equipmentDiv = document.createElement('div');
             equipmentDiv.classList.add('equipment');
         
             const fields = ['id', 'tagNumber', 'description', 'specificLocation'];
         
             fields.forEach(field => {
                 if (field !== 'id') {
                     const fieldDiv = document.createElement('div');
                     fieldDiv.classList.add('equipment-field');
         
                     const label = document.createElement('label');
                     label.htmlFor = `equipment_${field}_${index}`;
                     label.textContent = field.charAt(0).toUpperCase() + field.slice(1).replace(/([A-Z])/g, ' $1').trim() + ':';
         
                     const input = document.createElement('input');
                     input.type = 'text';
                     input.id = `equipment_${field}_${index}`;
                     input.name = `equipment[${index}].${field}`;
                     input.value = equipment[field] || '';
         
                     fieldDiv.appendChild(label);
                     fieldDiv.appendChild(input);
                     equipmentDiv.appendChild(fieldDiv);
                 } else {
                     const input = document.createElement('input');
                     input.type = 'hidden';
                     input.name = `equipment[${index}].${field}`;
                     input.value = equipment[field] || '';
                     equipmentDiv.appendChild(input);
                 }
             });
         
             const removeButton = document.createElement('button');
             removeButton.type = 'button';
             removeButton.textContent = 'Remove';
             removeButton.onclick = () => equipmentDiv.remove();
             equipmentDiv.appendChild(removeButton);
         
             container.appendChild(equipmentDiv);
         }
    })


    </script>
</body>
</html>
