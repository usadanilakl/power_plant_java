######################################################################################
#One Drive - Replace with actual credentials
######################################################################################

spring.security.oauth2.client.registration.onedrive.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.onedrive.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.onedrive.scope=Files.ReadWrite, offline_access
spring.security.oauth2.client.registration.onedrive.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.onedrive.token-uri=https://login.microsoftonline.com/YOUR_TENANT_ID/oauth2/v2.0/token

######################################################################################
# SharePoint Certificate Access - Replace with actual credentials
######################################################################################

sharepoint.azure.client-id=YOUR_CLIENT_ID
sharepoint.azure.tenant-id=YOUR_TENANT_ID
sharepoint.azure.pfx-path=${user.dir}${file.separator}data${file.separator}certificate.pfx
sharepoint.azure.pfx-password=YOUR_PFX_PASSWORD
sharepoint.azure.scopes=https://YOUR_TENANT.sharepoint.com/.default
sharepoint.site.hostname=jpowerusa.sharepoint.com
sharepoint.site.path=/sites/JG

######################################################################################
# Email Service Configuration - Replace with actual sender email
######################################################################################

email.graph.from=YOUR_EMAIL_ADDRESS

######################################################################################
# Gemini AI Agent - Replace with actual API key
######################################################################################

gemini.api.key=YOUR_GEMINI_API_KEY

######################################################################################
# JWT Secret for PWA Authentication
######################################################################################

jwt.secret=YOUR_256_BIT_HEX_SECRET_HERE
