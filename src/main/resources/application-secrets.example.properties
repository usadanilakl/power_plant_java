######################################################################################
#One Drive - Replace with actual credentials
######################################################################################

spring.security.oauth2.client.registration.onedrive.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.onedrive.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.onedrive.scope=Files.ReadWrite, offline_access
spring.security.oauth2.client.registration.onedrive.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.onedrive.token-uri=https://login.microsoftonline.com/YOUR_TENANT_ID/oauth2/v2.0/token

######################################################################################
# SharePoint Certificate Access - Replace with actual credentials
######################################################################################

sharepoint.azure.client-id=YOUR_CLIENT_ID
sharepoint.azure.tenant-id=YOUR_TENANT_ID
sharepoint.azure.pfx-path=${user.dir}${file.separator}data${file.separator}certificate.pfx
sharepoint.azure.pfx-password=YOUR_PFX_PASSWORD
sharepoint.azure.scopes=https://YOUR_TENANT.sharepoint.com/.default
sharepoint.site.hostname=jpowerusa.sharepoint.com
sharepoint.site.path=/sites/JG

######################################################################################
# Email Service Configuration - Replace with actual sender email
######################################################################################

email.graph.from=YOUR_EMAIL_ADDRESS
email.graph.fallback=

######################################################################################
# Gemini AI Agent - Replace with actual API key
######################################################################################

gemini.api.key=YOUR_GEMINI_API_KEY

######################################################################################
# JWT Secret for PWA Authentication
######################################################################################

# Generate with: openssl rand -hex 32   (must NOT be left as this placeholder)
jwt.secret=YOUR_256_BIT_HEX_SECRET_HERE
# During a secret rotation, set this to the PREVIOUS jwt.secret so tokens signed with
# the old key keep working until they expire (no forced logout). Remove after the grace window.
#jwt.secret-previous=

######################################################################################
# PostgreSQL Hub Database (hub profile only)
# Run scripts/setup-postgres.ps1 to create the database and populate these values
######################################################################################

PG_USERNAME=power_plant
PG_PASSWORD=YOUR_PG_PASSWORD

######################################################################################
# Maximo OSLC API
# Object structures used: mxasset, mxapisr, mxapiwodetail, doclinks
# Token is the Maximo API key generated in the Maximo "API Keys" application.
######################################################################################

maximo.base-url=https://YOUR_MAXIMO_HOST/maximo
maximo.api-key=YOUR_MAXIMO_API_KEY
maximo.default-site=JG

######################################################################################
# OnLocation (WhosOnLocation) contractor directory — hub-only.
# Required for ContractorReconciler. Leave blank on desktop installs.
######################################################################################

onlocation.api.key=YOUR_ONLOCATION_API_KEY
onlocation.base.url=https://api.whosonlocation.com/v1
contractor.reconcile.interval-ms=86400000

######################################################################################
# Power Automate V2 Flow URLs
# One per entity type. Each URL embeds a SAS signature (sig=...) — treat as a credential.
# Leave blank to disable the PA fallback for that entity (cert path still works).
######################################################################################

pa.flow.work-request-url=
pa.flow.jha-url=
pa.flow.field-list-url=
pa.flow.inventory-url=
pa.flow.sds-url=
pa.flow.qualifications-url=
