######################################################################################
# JWT for PWA Authentication — RS256 (asymmetric)
######################################################################################

# MIGRATION: the old HS256 `jwt.secret` is retired. The hub now signs with an RS256 PRIVATE key and
# distributes the PUBLIC key to the PWA, the Supabase Edge Function, and desktop installs. If the
# PEM files below are missing at startup the hub GENERATES a keypair automatically (dev bootstrap,
# logged as a warning) — for production, generate and back up a real keypair:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out data/jwt-private.pem
#   openssl rsa -pubout -in data/jwt-private.pem -out data/jwt-public.pem
# NOTE: existing HS256 tokens become invalid at cutover — users log in once more to get RS256 tokens.
jwt.algorithm=RS256
jwt.issuer=power-plant-hub
jwt.private-key-path=${user.dir}${file.separator}data${file.separator}jwt-private.pem
jwt.public-key-path=${user.dir}${file.separator}data${file.separator}jwt-public.pem

######################################################################################
# Supabase secondary auth authority (hub-side) — see project/features/users/dual-auth.md
######################################################################################

# Project URL + service-role key (SECRET — full admin, bypasses RLS; hub-only, never ship to browser).
supabase.url=https://YOUR_PROJECT.supabase.co
supabase.service.role.key=YOUR_SERVICE_ROLE_KEY
# Public anon key. Also needed in ng-ui/src/environments/*.ts. The hub uses it to VERIFY a password
# against Supabase (the /reconcile password grant); if omitted it falls back to the service key.
supabase.anon.key=YOUR_ANON_KEY

# How the hub VERIFIES Supabase-issued JWTs (PwaJwtAuthFilter accepts both issuers). Provide ONE:
#  • Asymmetric signing keys (RS/EC): export the Supabase public key PEM and point at it here.
#supabase.jwt.public-key-path=${user.dir}${file.separator}data${file.separator}supabase-jwt-public.pem
#  • Default HS256 project: paste the Supabase JWT secret (Dashboard → Settings → API → JWT Settings).
#supabase.jwt.secret=YOUR_SUPABASE_JWT_SECRET
# Optional explicit Supabase issuer string; otherwise auto-detected (…supabase.co / …/auth/v1).
#supabase.jwt.issuer=https://YOUR_PROJECT.supabase.co/auth/v1

# Force-disable Supabase integration even if the URL/key are set (hub runs standalone).
#supabase.enabled=false
# One-shot: mirror existing active hub users into Supabase on startup (dev profile only). See dual-auth.md → "Bulk-provision".
#supabase.provision-existing-on-startup=true

