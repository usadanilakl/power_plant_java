java.awt.headless=false


logging.level.com.fasterxml.jackson=WARN
logging.level.org.springframework.http.converter.json=INFO
#logging.level.org.springframework.web=DEBUG

# SharePoint integration
logging.level.com.dk_power.power_plant_java.config.SharePointConfig=INFO
logging.level.com.dk_power.power_plant_java.sevice.sharepoint=INFO

# SharePoint Work Request Sync
sharepoint.sync.interval=120000
sharepoint.sync.enabled=true

