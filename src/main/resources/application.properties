spring.application.name=power_plant_java
#spring.profiles.active=dev
#spring.profiles.active=test
#spring.profiles.active=prod
#spring.profiles.active=test,hub,server
spring.profiles.active=prod,hub,server
#spring.profiles.active=prod,hub,server,postgres
spring.profiles.include=secrets
server.port=8082
server.servlet.session.timeout=24h
jwt.expiration-hours=720
project.root=${user.dir}
qa.directory=${project.root}${file.separator}qa-data

spring.devtools.restart.enabled=true
spring.output.ansi.enabled=never

######################################################################################
#Host
######################################################################################
app.host=${APP_HOST:default}

######################################################################################
#Synchronization
######################################################################################
# Central Server Sync (set enabled=true to use server instead of peer-to-peer)
sync.server.enabled=true
#sync.server.url=http://192.168.12.146:8090
sync.server.url=http://10.10.190.123:8090
#sync.server.url=http://192.168.190.69:8090

# Field-Based Sync Configuration (peer-to-peer on local network, used when server.enabled=false)
sync.machine.id=
sync.machine.name=${COMPUTERNAME:${HOSTNAME:Machine}}
sync.discovery.port=8083
sync.discovery.enabled=true
# Polling interval - now serves as fallback only since SSE provides real-time updates
# Increased from 30s to 5 minutes since SSE handles real-time sync
sync.interval.seconds=300
sync.retention.days=30
sync.auto-resync.enabled=true

# Hub mode — uncomment on the designated hub machine to act as sync server.
# When active, hub controllers replace client-side resync/update controllers.
# Set sync.server.enabled=false on the hub since it IS the server.
#sync.role=hub
#sync.hub.retention-days=90
#sync.hub.batch-size=500
#sync.hub.compaction-enabled=true


######################################################################################
#Propertis import
######################################################################################
spring.config.import=optional:classpath:device-configs/${DEVICE_CONFIG:opi}.properties


######################################################################################
#Database
######################################################################################
# Database URL is set per profile (see application-{dev,test,prod}.properties)
# Default fallback (overridden by profile):
spring.datasource.url=jdbc:h2:file:./db/devdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;LOCK_TIMEOUT=10000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.leak-detection-threshold=600000
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
# Let the database enforce NOT NULL constraints instead of Hibernate.
# Required for sync: createEntityFromSync inserts placeholder entities with NULL in
# VARCHAR columns (to avoid CHECK constraint violations on enum columns).
# Hibernate's @Column(nullable=false) would throw PropertyValueException before
# the real values are set by applyFieldChange().
spring.jpa.properties.hibernate.check_nullability=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

h2.backup.directory=${user.dir}/h2-backups
#h2.backup.shared.directory=${user.dir}/h2-backups/shared
h2.backup.shared.directory=J:\\Jackson Generation P&IDs\\Manager App\\pid_db_backup

# Full resync file backup directory (for file sync backup)
sync.backup.file.directory=J:\\Jackson Generation P&IDs\\Manager App\\pid_file_backup
# Enable scheduled backups on this machine (set to true only on the "source of truth" machine)
sync.backup.enabled=false
# Cron expression for scheduled backups (default: 2 AM daily)
sync.backup.cron=0 0 2 * * ?

#spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
spring.jpa.properties.hibernate.current_session_context_class=org.hibernate.context.internal.ThreadLocalSessionContext
#logging.level.org.springframework.security=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.flyway.baselineOnMigrate=true

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql

######################################################################################
#Files
######################################################################################

files.root.path=${user.dir}${file.separator}uploads
files.relative.path=uploads
files.allowed-extensions=pdf,png,jpg,jpeg,tif,tiff,dwg,dxf,xlsx,xls,docx,doc,stl,obj,3mf
