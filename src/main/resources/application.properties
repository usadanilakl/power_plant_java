######################################################################################
# Email Correspondence - polling interval and scheduling
######################################################################################
# Email polling interval in milliseconds (default: 600000 = 10 minutes)
email.poll.interval=600000
# Enable Spring task scheduling for email polling
spring.task.scheduling.enabled=true
# 53 @Scheduled methods across 36 classes (8 of those classes hub-only), so ~45 share this pool on a
# desktop. Many block on network I/O — hub, SharePoint, Supabase, Maximo, WLED — and off-network each
# one parks a thread for the full connect timeout (10s in several cases). At 10 threads the pool can
# be fully occupied by dead connects while local jobs (cleanup, compaction, bookkeeping) starve, then
# fire in a burst when a slot frees. Blocked threads cost ~0 CPU; this buys headroom, not throughput.
# Cost is ~1MB of stack per extra thread.
spring.task.scheduling.pool.size=20
# Sync receive tuning — smaller batches and wall-clock budget prevent
# long H2 table locks from blocking foreground HTTP requests
sync.receive.batch-size=100
sync.receive.max-duration-ms=1500
# CC recipients for PWA email fallback (semicolon-separated)
email.fallback.cc=

