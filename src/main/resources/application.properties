######################################################################################
# Email Correspondence - polling interval and scheduling
######################################################################################
# Email polling interval in milliseconds (default: 600000 = 10 minutes)
email.poll.interval=600000
# Enable Spring task scheduling for email polling
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=10
# Sync receive tuning — smaller batches and wall-clock budget prevent
# long H2 table locks from blocking foreground HTTP requests
sync.receive.batch-size=100
sync.receive.max-duration-ms=1500
# CC recipients for PWA email fallback (semicolon-separated)
email.fallback.cc=

######################################################################################
# Test UI (disabled by default, enabled in test profile)
######################################################################################
test.ui.enabled=false

######################################################################################
# EtaPro Scraper — Persistent Excel COM automation for historian data
######################################################################################
# Master flag — off by default. Enable per-device via device-configs/*.properties
etapro.enabled=false

# Template workbooks (manually created per setup-guide.md)
etapro.live.template.path=${user.dir}/etapro/template-live.xlsx
etapro.history.template.path=${user.dir}/etapro/template-history.xlsx

# Runtime directories (auto-created)
etapro.output.path=${user.dir}/etapro/output
etapro.signal.path=${user.dir}/etapro/signal

# PowerShell script (shipped with repo)
etapro.script.path=${user.dir}/scripts/etapro-scrape.ps1

# Per-batch scrape timeout (Excel refresh + CSV export)
etapro.scrape.timeout.seconds=120

# Live mode: minimum interval between live cycles (ms)
etapro.live.interval.ms=3000

# Worker idle sleep (ms) when no live tick is due and no history batches pending
etapro.worker.idle-sleep.ms=200

# Job retention: completed/failed/cancelled jobs older than this are deleted
etapro.job.retention.days=90
etapro.job.cleanup.cron=0 0 3 * * ?

######################################################################################
# Red Tag desktop automation (rebuilt) — sevice/automation/redtag/
# Bound to RedTagAutomationProperties. All keys have code defaults; override per machine.
######################################################################################
redtag.automation.enabled=true
redtag.automation.executable-path=J://RedTag/Redtag.exe
redtag.automation.process-name=Redtag.exe
redtag.automation.window-title=Redtag Enterprise
# Leave blank to use the patterns bundled at classpath:automation/redtag/patterns,
# extracted on startup to pattern-working-dir. Set to an absolute folder to override.
redtag.automation.pattern-base-path=
redtag.automation.pattern-working-dir=${user.dir}/automation/redtag/patterns
redtag.automation.default-similarity=0.80
redtag.automation.find-timeout-seconds=12
redtag.automation.auto-wait-timeout-seconds=30
redtag.automation.inter-step-delay-ms=200
# Blank username -> the OS account name is used (legacy behaviour)
redtag.automation.username=
redtag.automation.password=redtag
redtag.automation.fallback-username=automation
