######################################################################################
# Schedule v2 (managed crew patterns / assignments / events / coverage / PTO)
# When disabled (default), the v1 SharePoint Excel parser owns ShiftDay and the v2
# materialiser is a no-op. When enabled, the materialiser owns ShiftDay writes.
# rollback=true forces v1 to reassert on the next materialisation tick (kill switch).
schedule.v2.enabled=false
schedule.v2.rollback=false
# Rolling window the default-horizon materialise regenerates around today.
schedule.v2.horizon-days=180
schedule.v2.backfill-days=7
# Hub-only periodic rematerialise (ms). Catches schedule-authoring/approvals that arrive on the hub
# via SYNC from a desktop/PWA (which never trigger the materialiser directly) — reflects them in
# ShiftDay within this interval instead of only at the 4:15 AM roll-forward. Idle-cheap (writes only
# changed rows). Raise very high to effectively disable. Only the hub runs it.
schedule.v2.hub-refresh-interval-ms=600000
# Past-lock grace window (days). Days strictly before (today - N) are FROZEN: the materialiser never
# rewrites them and authoring (overrides/coverage/manual materialise) refuses to target them, so
# history reflects what actually happened. N is a short grace so a just-past mistake can still be
# corrected before it freezes. 0 = lock everything before today; a very large N = effectively no lock.
schedule.v2.lock-before-days=3

# Schedule v2 PTO email intake (Phase 4, hub-only). Master gate OFF by default: nothing polls,
# creates coverage, or emails coworkers until explicitly enabled after validating the parser
# against real forwarded mail. Dedup is three-tier (message id / source request id / user|dates).
schedule.pto.intake.enabled=false
# Mailbox to poll for forwarded time-off emails (defaults to the monitored inbox).
schedule.pto.intake.mailbox=${email.graph.from:}
# A message whose SUBJECT matches this regex is treated as a time-off email.
schedule.pto.intake.subject-regex=(?i)(pto|time.?off|vacation|leave request|day off)
schedule.pto.intake.poll-interval=600000
schedule.pto.intake.lookback-days=3
# Auto-approve (auto-move person + auto-create coverage) when the requester matches confidently
# and dates parsed; otherwise the request is staged PENDING_MANUAL_REVIEW regardless.
schedule.pto.auto-approve=true
# Outbound notifications. Set enabled=false for a dry run (persist + materialise, no email).
schedule.pto.notify.enabled=true
schedule.pto.notify.from=${email.graph.from:}
# Ops distro for "coverage needed" notices. Blank = don't send them.
schedule.pto.notify.coverage-cc=

# Hub mode — uncomment on the designated hub machine to act as sync server.
# When active, hub controllers replace client-side resync/update controllers.
# Set sync.server.enabled=false on the hub since it IS the server.
#sync.role=hub
#sync.hub.retention-days=90
