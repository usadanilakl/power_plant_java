# PowerShell script (shipped with repo)
etapro.script.path=${user.dir}/scripts/etapro-scrape.ps1

# Per-batch scrape timeout (Excel refresh + CSV export)
etapro.scrape.timeout.seconds=120

# Live mode: minimum interval between live cycles (ms)
etapro.live.interval.ms=3000

# Worker idle sleep (ms) when no live tick is due and no history batches pending
etapro.worker.idle-sleep.ms=200

# Job retention: completed/failed/cancelled jobs older than this are deleted
etapro.job.retention.days=90
etapro.job.cleanup.cron=0 0 3 * * ?

# ── EtaPro REST API — PRIMARY history source (scraper is the fallback) ──
# When enabled, history batches fetch from the EtaPRO historian REST API (interpolated endpoint)
# instead of the Excel scraper; on any API failure it falls back to the scraper (unless strict=true).
# Live still uses the scraper. Keep the auth value in application-secrets.properties, not here.
etapro.api.enabled=false
# Confirmed working plant base URL (note the /EtaPROWeb/api prefix, plain http, LAN-only, no auth).
etapro.api.base-url=http://jpvetaprojg/EtaPROWeb/api
etapro.api.version=1
etapro.api.server-name=jpvetaprojg
etapro.api.unit-designation=1
# Collection endpoint: plotvalues (numberOfIntervals — confirmed working) or interpolated (numberOfValues).
etapro.api.history.endpoint=plotvalues
# Live "current value": one call per point to the historian's single-value endpoint at-or-before now
# (confirmed-working on the plant API). Live is API-first too; the Excel Live template is the fallback.
etapro.api.live.endpoint=archivevalue
etapro.api.live.retrieval=AtOrBefore
# Window (seconds back from now) used ONLY by the Excel Live-template fallback, not the API.
etapro.live.window.seconds=15
# Plant timezone. The request window is converted plant-local -> UTC and sent with timesOffset=0
# (confirmed-working pattern); response UTC timestamps are converted back to this zone (DST-aware,
# CST/CDT) so stored times match the scraper. Central time for Jackson Generation.
etapro.api.zone=America/Chicago
# Sent as the API 'timesOffset'. Kept 0 because we send the window already in UTC.
etapro.api.times-offset=0
# Series density: intervals/values ~= window-seconds / resolution-seconds (capped by max-values).
etapro.api.history.resolution-seconds=60
etapro.api.history.max-values=100000
etapro.api.tag-category=Value
etapro.api.timeout-seconds=60
# The EtaPRO Web API is IIS Windows-authenticated (returns 401 without auth). By default the app
# authenticates as the CURRENT Windows user (transparent NTLM) — matching the browser on the domain
# PC — so it must run as a domain user with EtaPRO access. allHosts | trustedHosts | disabled.
etapro.api.ntlm-transparent-auth=allHosts
# Explicit service account (overrides transparent auth); keep the password in application-secrets.properties.
etapro.api.auth-user=
etapro.api.auth-password=
etapro.api.auth-domain=
# Or a static auth header instead (e.g. a token): name + value.
etapro.api.auth-header-name=
etapro.api.auth-header-value=
# strict=true disables the scraper fallback (API-only).
etapro.api.strict=false
# EPLog (Operator/Event Log) API. event-log-id is REQUIRED to use the API for the log — find it via
# GET http://jpvetaprojg/EtaPROWeb/api/v1/jpvetaprojg/eplog (0 = unset → EPLog falls back to the scraper).
# max-rows 0 = all entries (the scraper template was capped at 100).
etapro.api.eplog.event-log-id=0
etapro.api.eplog.max-rows=0
etapro.api.eplog.hide-deactivated=false

######################################################################################
# Red Tag desktop automation (rebuilt) — sevice/automation/redtag/
# Bound to RedTagAutomationProperties. All keys have code defaults; override per machine.
######################################################################################
redtag.automation.enabled=true
# Global ESC hotkey that pauses a running build. This is the ONLY eager SikuliX entry point:
# registering it loads opencv_java430.dll + JNA and installs an OS-wide keyboard hook at startup,
# even on desktops that never run an automation. OPT-IN (off by default) so the SikuliX native
# layer stays out of the JVM everywhere it isn't needed; set true in device-configs/<id>.properties
# on machines that actually run Red Tag builds. Automation still works with this off — SikuliDriver
# loads SikuliX lazily when a build starts; only ESC-to-pause is unavailable.
redtag.automation.hotkey-enabled=false
redtag.automation.executable-path=J://RedTag/Redtag.exe
redtag.automation.process-name=Redtag.exe
redtag.automation.window-title=Redtag Enterprise
# Leave blank to use the patterns bundled at classpath:automation/redtag/patterns,
# extracted on startup to pattern-working-dir. Set to an absolute folder to override.
redtag.automation.pattern-base-path=
redtag.automation.pattern-working-dir=${user.dir}/automation/redtag/patterns
redtag.automation.default-similarity=0.80
redtag.automation.find-timeout-seconds=12
redtag.automation.auto-wait-timeout-seconds=30
redtag.automation.inter-step-delay-ms=200
# Blank username -> the OS account name is used (legacy behaviour)
redtag.automation.username=
redtag.automation.password=redtag
redtag.automation.fallback-username=automation
