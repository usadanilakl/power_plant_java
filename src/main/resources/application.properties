######################################################################################
# Maximo source — where THIS instance gets Maximo data.
#   local (default): call Maximo directly (needs maximo.api-key in secrets).
#   hub: proxy the Maximo PM overview to the hub — for a kiosk/display whose own network can't reach
#        Maximo. Requires hub.kiosk.email/password (secrets) + maximo.hub.url. NOTE: source=hub disables
#        the direct NgMaximoController, so the maximo.api-key baked into the shared jar is simply IGNORED
#        on a kiosk (no collision) — a kiosk runs the same jar with only an external source=hub override.
######################################################################################
maximo.source=local
# Public hub URL for the kiosk proxy (falls back to sync.server.url when blank). A WiFi/off-LAN kiosk MUST
# use the PUBLIC address, e.g. https://jgportal.jpowerusa.com — the internal sync.server.url (10.x) won't route.
maximo.hub.url=

######################################################################################
# Field List → Maximo Service Request bridge (v1)
# When enabled, PWA field list submissions ALSO create a Maximo SR on the hub side.
# The submit path is: PWA → hub → H2 (always) → best-effort Maximo SR + SP push.
# On Maximo failure the row is queued and MaximoFieldListSyncJob retries every 5 min.
# A separate poll (60 s) pulls Maximo status changes back into H2 so the PWA reflects
# ops closing/cancelling a record. Delete in the PWA cancels the corresponding record.
# Records are dispatched to SR (default, planner-triaged) or WO (route-to-wo-types)
# based on the FieldListType — see route-to-wo-types + wo-worktype-mappings below.
#
# Feature-flagged off by default. Requires maximo.api-key set (else the bean is absent
# regardless of this flag). See project/features/maximo/field-list-sr.md.
######################################################################################
maximo.field-list.enabled=false
# Optional Maximo classstructureid to preset on SRs created from field list items.
# Leave blank for ops to triage on receipt. Populate once a FieldListType→classstructureid
# mapping table is agreed with the Maximo admin. Not applied to WO-routed rows (WOs use
# worktype instead — see wo-worktype-mappings).
maximo.field-list.classstructureid=
# Comma-separated FieldListType names that should be created as Work Orders instead of
# Service Requests. Case-insensitive match on the FieldListType Value name. Example:
#   maximo.field-list.route-to-wo-types=Insulation Removal,Painting
# Rows of unlisted types stay on the SR path. Blank/empty = all types route to SR.
# Rationale: WO routing gives us the wonum at creation time, so we can programmatically
# COMP it when the local status flips to wo-completion-status (default "Closed"). With
# SR routing, a manual planner-escalation in Maximo creates a WO whose number we never
# see — we'd lose the ability to close it from the PWA.
maximo.field-list.route-to-wo-types=
# Comma-separated FieldListType:worktype pairs applied to WO-routed rows. The worktype
# on the right must exist in the Maximo tenant's WORKTYPE domain or the create call
# fails. Example:
#   maximo.field-list.wo-worktype-mappings=Insulation Removal:INS
# A type listed in route-to-wo-types but missing here gets a null worktype (Maximo
# lets that through; ops assigns on triage).
maximo.field-list.wo-worktype-mappings=
# FieldListStatus name that triggers a WO COMP on Maximo when the local row's status
# flips to it. Applied only to WO-routed rows (SR routing ignores it). Blank/unset =
# never auto-complete (the WO stays in ops' queue until closed manually in Maximo).
maximo.field-list.wo-completion-status=Closed
# Retry cadences — leave defaults unless load-testing dictates otherwise.
maximo.field-list.backfill-interval-ms=300000
maximo.field-list.backfill-initial-delay-ms=60000
maximo.field-list.backfill-batch-size=20
# status-poll-page-size applies INDEPENDENTLY to each of the SR and WO queries per tick
# (so peak page-count per tick is 2 * page-size). Bump if either queue grows past cap.
maximo.field-list.status-poll-interval-ms=60000
maximo.field-list.status-poll-initial-delay-ms=120000
maximo.field-list.status-poll-page-size=200
maximo.field-list.status-poll-lookback-min=30

