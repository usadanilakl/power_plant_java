spring.application.name=power_plant_java
#spring.profiles.active=dev
spring.profiles.active=prod
#spring.profiles.include=secrets
server.port=8082
server.servlet.session.timeout=24h
project.root=${user.dir}
qa.directory=${project.root}${file.separator}qa-data

spring.devtools.restart.enabled=true

######################################################################################
#Host
######################################################################################
app.host=${APP_HOST:default}

######################################################################################
#Synchronization
######################################################################################
# Central Server Sync (set enabled=true to use server instead of peer-to-peer)
sync.server.enabled=true
#sync.server.url=http://192.168.12.146:8090
sync.server.url=http://10.10.190.123:8090
#sync.server.url=http://192.168.190.69:8090

# Field-Based Sync Configuration (peer-to-peer on local network, used when server.enabled=false)
sync.machine.id=
sync.machine.name=${COMPUTERNAME:${HOSTNAME:Machine}}
sync.discovery.port=8083
sync.discovery.enabled=true
# Polling interval - now serves as fallback only since SSE provides real-time updates
# Increased from 30s to 5 minutes since SSE handles real-time sync
sync.interval.seconds=300
sync.retention.days=30
sync.auto-resync.enabled=true


######################################################################################
#Propertis import
######################################################################################
spring.config.import=optional:classpath:device-configs/${DEVICE_CONFIG:opi}.properties


######################################################################################
#Database
######################################################################################
# Database URL is set per profile (see application-{dev,test,prod}.properties)
# Default fallback (overridden by profile):
spring.datasource.url=jdbc:h2:file:./db/devdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

h2.backup.directory=${user.dir}/h2-backups
#h2.backup.shared.directory=${user.dir}/h2-backups/shared
h2.backup.shared.directory=J:\\Jackson Generation P&IDs\\Manager App\\pid_db_backup

# Full resync file backup directory (for file sync backup)
sync.backup.file.directory=J:\\Jackson Generation P&IDs\\Manager App\\pid_file_backup
# Enable scheduled backups on this machine (set to true only on the "source of truth" machine)
sync.backup.enabled=false
# Cron expression for scheduled backups (default: 2 AM daily)
sync.backup.cron=0 0 2 * * ?

#spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
spring.jpa.properties.hibernate.current_session_context_class=org.hibernate.context.internal.ThreadLocalSessionContext
#logging.level.org.springframework.security=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.flyway.baselineOnMigrate=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

######################################################################################
#Files
######################################################################################

files.root.path=${user.dir}${file.separator}uploads
files.relative.path=uploads


excel.path.default=static/data_transfer/files/default.xlsx
excel.sheetName.default=Sheet1

excel.path.lotoPoints=static/data_transfer/files/LOTO_ready.xlsx
excel.sheetName.lotoPoints=IsoPoints

excel.path.valves=static/data_transfer/files/Valve List.xlsx
excel.sheetName.hrsgValves=HRSG
excel.sheetName.kiewitValves=BOP

excel.path.pipes=static/data_transfer/files/Piping List.xlsx
excel.sheetName.hrsgPipes=HRSG Line List
excel.sheetName.kiewitPipes=Kiewit Line List

excel.path.oldLotoPoints=static/data_transfer/files/OldLotoPoints.xlsx
excel.sheetName.oldLotoPoints=Isolation Device List

excel.path.bypasses=static/data_transfer/files/EQ Valves.xlsx
excel.sheetName.bypasses=Sheet1

excel.path.elTable=static/data_transfer/files/Electrical Table.xlsx
excel.sheetName.elTable=Sheet1

json.path.pids=static/data_transfer/files/pids_json_mod.js
json.path.heatTrace=static/data_transfer/files/heat_trace.js
json.path.highlights=static/data_transfer/files/Equipment.js

aws.s3.bucket=jg-technical
aws.region=us-east-2

file.path=/

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

git.token=token


######################################################################################
#Backup App
######################################################################################
backup.app.directory=${project.root}${file.separator}browser
backup.app.data=${backup.app.directory}${file.separator}data
backup.app.files=${backup.app.directory}${file.separator}data${file.separator}files.js
backup.app.equipment=${backup.app.directory}${file.separator}data${file.separator}equipment.js
backup.app.loto-points=${backup.app.directory}${file.separator}data${file.separator}loto-points.js
backup.app.heat-trace=${backup.app.directory}${file.separator}data${file.separator}heat-trace.js
backup.app.reference-data=${backup.app.directory}${file.separator}data${file.separator}reference-data.js
backup.app.properties-data=${backup.app.directory}${file.separator}data${file.separator}properties-data.js

######################################################################################
#Performance Monitoring
######################################################################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus,shutdown
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true
# Graceful shutdown - wait for active requests to complete
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.metrics.tags.application=power-plant-sync
management.metrics.tags.host=${sync.machine.name}

######################################################################################
#One Drive - credentials in application-secrets.properties (gitignored)
######################################################################################

