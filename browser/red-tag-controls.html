<!DOCTYPE html>
<html>
<head>
  <title>Control Buttons Example</title>
  <script>
    const baseUrl = 'http://localhost:8082/red-tag-controls'
    async function sendRequest(url, method='GET', body=null) {
      try {
        const response = await fetch(baseUrl+url, {
          method: method,
          headers: {'Content-Type': 'application/json'},
          body: body ? JSON.stringify(body) : null
        });
        const data = await response.text();
        // alert("Response: " + data);
      } catch (error) {
        alert("Error: " + error);
      }
    }
    
    async function runSequence() {
      try {
        await sendRequest('/open-app');
        await sendRequest('/login');
        await sendRequest('/open-loto-builder');
        await sendRequest('/build-loto-with-no-standard');
        await sendRequest('/build-loto-with-new-points');
        alert("Sequence completed successfully");
      } catch (error) {

      }
    }

    
  </script>
</head>
<body>
  <button onclick="sendRequest('/open-app')">Open Red Tag</button>
  <button onclick="sendRequest('/login')">Login</button>
  <button onclick="sendRequest('/open-loto-builder')">Open Loto Builder</button>
  <button onclick="sendRequest('/build-loto-with-no-standard')">LOTO with no standard</button>
  <button onclick="sendRequest('/build-loto-with-new-points')">Build With New Points</button>
  <button onclick="sendRequest('/complete-loto-build')">Complete Loto Build</button>
  <button onclick="runSequence()">Run Sequence</button>
</body>
</html>
