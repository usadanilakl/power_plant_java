<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jackson Generation</title>
  <base href="/">
  <!-- viewport-fit=cover lets the page paint under the notch / home indicator; layout keeps clear of
       them via env(safe-area-inset-*) (see styles.css). maximum-scale=5 keeps pinch-zoom available. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent so the iOS status bar sits over our own header colour rather than a white band -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Matches --header-background per theme, so the Android status bar tints to the actual header. -->
  <meta name="theme-color" content="#3f51b5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2c3e50" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<app-root></app-root>
<noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
