@if (selectedWr(); as wr) {
  <div class="wr-header">
    <span class="wr-header-label"><span class="wr-header-jha">JHA</span> for Work Request:</span>
    <span class="wr-header-scope">{{ wr.workScope }}</span>
    <span class="wr-header-meta">{{ wr.company }} &mdash; {{ wr.dateOfWork | date:'shortDate' }}</span>
    <span class="wr-header-id">#{{ wr.sharepointId }}</span>
  </div>
} @else {
  <div class="wr-header wr-header--empty">
    Select a Work Request from the left panel to begin.
  </div>
}

<div class="action-bar">
  <button class="resubmit-button" (click)="openTablePopup()">Use Previous JHA Data</button>
  <button class="preview-toggle" [class.active]="showPreview" (click)="togglePreview()">
    {{ showPreview ? 'Hide Preview' : 'Paper Preview' }}
  </button>
</div>

<app-jha-form (jhaChanged)="onJhaChanged($event)"></app-jha-form>

@if (showPreview) {
  <div class="jha-preview-panel">
    <app-jha-paper-preview [jha]="previewJha()"></app-jha-paper-preview>
  </div>
}

<app-popup
    [title]="'Previously submitted JHAs from this device / browser'"
    [size]="'large'"
    [isOpen]="isTablePopupOpen"
    (close)="closeTablePopup()"
>
    <app-jha-table (reused)="onJhaReused()"></app-jha-table>
</app-popup>
