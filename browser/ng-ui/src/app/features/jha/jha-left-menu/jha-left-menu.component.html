<div class="tabs">
  <button
    class="tab"
    [class.active]="activeTab() === 'needs-jha'"
    (click)="activeTab.set('needs-jha')"
  >Needs JHA</button>
  <button
    class="tab"
    [class.active]="activeTab() === 'submitted'"
    (click)="activeTab.set('submitted')"
  >Submitted JHAs</button>
</div>

@if (activeTab() === 'needs-jha') {
  <app-table
    [items]="wrItems()"
    [columns]="wrColumns"
    [highlightId]="highlightId()"
    [highlightField]="'sharepointId'"
    (rowClicked)="onWrRowClick($event)"
  ></app-table>
} @else {
  <app-table
    [items]="jhaItems()"
    [columns]="jhaColumns"
    (rowClicked)="onJhaRowClick($event)"
  ></app-table>
}

<app-popup
    [title]="'Select an Action'"
    [size]="'medium'"
    [isOpen]="isActionMenuOpen"
    (close)="closeActionMenu()"
>
    <app-buttons [buttons]="actionButtons" [layout]="'column'"></app-buttons>
</app-popup>
