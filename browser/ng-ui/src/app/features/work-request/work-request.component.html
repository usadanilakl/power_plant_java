@if (mode() === 'select') {
  <div class="action-selector">
    <h2 class="action-title">Work Request</h2>
    <p class="action-subtitle">What would you like to do?</p>
    <div class="action-cards">
      <button class="action-card" (click)="selectNew()">
        <span class="action-card-icon">📝</span>
        <span class="action-card-label">Submit New Work Request</span>
        <span class="action-card-desc">Start a blank form</span>
      </button>
      <button class="action-card" (click)="selectResubmit()">
        <span class="action-card-icon">📋</span>
        <span class="action-card-label">Resubmit Existing Request</span>
        <span class="action-card-desc">Select from previous submissions</span>
      </button>
    </div>
  </div>
} @else if (mode() === 'wizard') {
  <!--
    No sticky header here. The wizard carries its own bar: Back on the left, where it is now the
    only Back on the page, and Resubmit moved into that bar's overflow menu. Stacking this header
    on top of it gave two Back buttons that did different things and a second competing action on
    every step.
  -->
  <app-work-request-wizard
    (skipToForm)="openFullForm()"
    (reviewReady)="openFullForm()"
    (resubmitRequested)="openTablePopup()"
    (exitRequested)="backToSelect()"
  ></app-work-request-wizard>
} @else {
  <div class="sticky-header">
    <button class="back-button" (click)="backToSelect()">← Back</button>
    <button class="resubmit-button" (click)="openTablePopup()">Resubmit Previous Request</button>
  </div>
  <app-work-request-form [showClearButton]="true"></app-work-request-form>
}

<app-popup
    [title]="'Select a previous request'"
    [size]="'large'"
    [isOpen]="isTablePopupOpen"
    (close)="closeTablePopup()"
>
    <app-work-request-table
        [resubmitMode]="true"
        (actionPopupClosed)="closeTablePopup()"
    ></app-work-request-table>
</app-popup>
