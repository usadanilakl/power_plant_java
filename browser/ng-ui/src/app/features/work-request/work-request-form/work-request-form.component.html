<app-reactive-form
  [entity]="entity()"
  [fields]="fields()"
  [title]="'Work Request'"
  (formValueChange)="onAnyValueChange($event)"
  (formSubmit)="onSubmit($event)"
>
  <ng-container extra-buttons>
    <app-email-prompt
      to="dklokov@jpowerusa.com"
      subject="Failed to submit work request"
      [body]="entity().getEmailBody()"
    ></app-email-prompt>
  </ng-container>
</app-reactive-form>
