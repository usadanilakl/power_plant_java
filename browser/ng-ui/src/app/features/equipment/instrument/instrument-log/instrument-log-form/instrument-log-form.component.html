@if (emailFallbackData()) {
  <div class="email-fallback-banner">
    <p><strong>Submission failed.</strong> All automatic methods unavailable. Please submit via email:</p>
    <div class="email-fallback-actions">
      <a [href]="emailFallbackData()?.mailto" class="email-button primary" (click)="onFallbackEmailClick()">
        Open Email Client
      </a>
      <button class="email-button gmail" (click)="openFallbackGmail()">
        Open Gmail
      </button>
      @if (hasAttachments()) {
        <button class="email-button accent" (click)="downloadAttachments()">
          Download Attachments ({{ attachmentCount() }})
        </button>
      }
      <button class="email-button secondary" (click)="onEmailSent()">
        Done
      </button>
    </div>
    @if (hasAttachments()) {
      <p class="attachment-note">Please download and manually attach files to your email.</p>
    }
  </div>
}

<app-reactive-form
  [entity]="entity()"
  [fields]="fields()"
  [title]="'Instrumentation Log'"
  (formValueChange)="onAnyValueChange($event)"
  (formSubmit)="onSubmit($event)"
>
</app-reactive-form>

<div class="email-submit-section">
  <p class="email-submit-label">Or submit via email:</p>
  <div class="email-submit-actions">
    <button class="email-button primary" (click)="submitViaEmail()">
      Open Email Client
    </button>
    <button class="email-button gmail" (click)="submitViaGmail()">
      Open Gmail
    </button>
  </div>
</div>
