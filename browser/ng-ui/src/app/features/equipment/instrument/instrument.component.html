@if (mode() === 'select') {
  <div class="action-selector">
    <h2 class="action-title">Instrumentation</h2>
    <p class="action-subtitle">What would you like to do?</p>
    <div class="action-cards">
      <button class="action-card" (click)="selectExisting()">
        <span class="action-card-icon">🔍</span>
        <span class="action-card-label">Select Existing Instrument</span>
        <span class="action-card-desc">Browse and select an instrument to fill out a log</span>
      </button>
      <button class="action-card" (click)="selectNew()">
        <span class="action-card-icon">➕</span>
        <span class="action-card-label">Create New Instrument</span>
        <span class="action-card-desc">Add a new instrument to the database</span>
      </button>
    </div>
  </div>
} @else if (mode() === 'log') {
  <div class="form-header">
    <button class="back-button" (click)="backToSelect()">← Back</button>
    <span class="selected-tag">{{ selectedInstrument()?.tagNumber }} — {{ selectedInstrument()?.description }}</span>
  </div>
  <app-instrument-log-form></app-instrument-log-form>
} @else if (mode() === 'new') {
  <div class="form-header">
    <button class="back-button" (click)="backToSelect()">← Back</button>
  </div>
  <app-instrument-form
    [formTitle]="'Add New Instrument to Database'"
    [submitButtonText]="'Add New Instrument to Database'"
  ></app-instrument-form>
}

<app-popup
    [title]="'Select an Instrument'"
    [size]="'large'"
    [isOpen]="isSelectPopupOpen"
    (close)="closeSelectPopup()"
>
    <app-instrument-table (actionPopupClosed)="onInstrumentSelected()"></app-instrument-table>
</app-popup>
