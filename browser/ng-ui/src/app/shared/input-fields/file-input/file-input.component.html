<div class="file-input-container"
     [class.dragover]="isDragover">
  <div class="drop-zone">
    <p>Drag and drop {{ multiple ? 'files' : 'a file' }} here, or</p>
    <div class="button-row">
      <label class="file-input-label">
        {{ label }}
        <input
          type="file"
          [accept]="accept"
          [multiple]="multiple"
          (change)="onFileSelected($event)"
          class="file-input"
        >
      </label>
      @if (hasCamera) {
        <label class="file-input-label camera-label">
          Take Photo
          <input
            type="file"
            accept="image/*"
            capture="environment"
            (change)="onFileSelected($event)"
            class="file-input"
          >
        </label>
      }
    </div>
  </div>
  @if (files.length > 0) {
    <div class="file-list">
      @for (attachment of files; track attachment.fileName; let i = $index) {
        <div class="file-info">
          @if (attachment.thumbnailBase64) {
            <img [src]="attachment.thumbnailBase64" class="file-thumbnail" alt="preview">
          }
          <span class="file-name">{{ attachment.fileName }}</span>
          <button type="button" class="remove-file" (click)="removeFile(i)">Remove</button>
        </div>
      }
    </div>
  }
</div>
