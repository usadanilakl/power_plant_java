@if (currentUser$ | async; as user) {
  <div class="user-icon" (click)="navigateToProfile()" [title]="user.name">
    <span class="initials">{{ getNameInitials(user.name) }}</span>
  </div>
} @else {
  <div class="user-icon" (click)="navigateToProfile()" [title]="localUserName ?? 'Profile'">
    <span class="initials">{{ getNameInitials(localUserName ?? undefined) }}</span>
  </div>
}
