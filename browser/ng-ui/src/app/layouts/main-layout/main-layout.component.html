<div class="layout-container">
  <header class="header">
    @if(isSideMenuEnabled() && isMobileView) {
      <button class="hamburger-btn" (click)="toggleMenu()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    }
    <div class="header-content">
      @if (header()) {
        <h1>{{ header() }}</h1>
      }@else {
        <h1>Jackson Generation</h1>  
      }
      <ng-content select="[header]"></ng-content>
    </div>
    <div class="header-actions">
        <app-theme-toggle></app-theme-toggle>
        @if (authService.isLoggedIn()) {
          <button class="auth-btn" (click)="logout()">Logout</button>
        } @else {
          <button class="auth-btn" (click)="login()">Login</button>
        }
    </div>
  </header>

  <div class="content-wrapper">
    @if(isSideMenuEnabled()){
      <div class="overlay" #overlay (click)="toggleMobileMenu()"></div>
      <nav class="left-menu" id="leftMenu" #leftMenu [style.width.px]="isMobileView ? null : menuWidth">
        <ng-content select="[left-menu]"></ng-content>
      </nav>
      @if(!isMobileView){
        <div class="resizer" id="resizer" #resizer (mousedown)="onResizerMouseDown($event)">
          <button class="menu-toggle-btn" (click)="toggleMenu()" title="{{ isMenuVisible ? 'Collapse Menu' : 'Expand Menu' }}">
            <span class="arrow" [class.collapsed]="!isMenuVisible"></span>
          </button>
        </div>
      }
    }
    <div class="main-and-footer">
      <main class="main-content" #mainContent>
        <ng-content select="[main-content]"></ng-content>
      </main>
      @if(isBottomMenuEnabled()){
        <div class="footer-resizer" #footerResizer (mousedown)="onFooterResizerMouseDown($event)"></div>
        <footer class="footer" #footer [style.height.px]="footerHeight">
          @if(bottomMenuHeader()!==null){
            <h1>{{ bottomMenuHeader() }}</h1>
          }
          <ng-content select="[bottom-menu]"></ng-content>
        </footer>}
    </div>
  </div>
</div>
