    <div class="layout-container">
      <header class="header">
        <div class="header-content">
          @if (header()) {
            <h1>{{ header() }}</h1>
          }@else {
            <h1>Jackson Generation</h1>  
          }
          <ng-content select="[header]"></ng-content>
        </div>
        <div class="header-actions">
            <app-theme-toggle></app-theme-toggle>
            <button class="toggle-menu-btn" (click)="toggleMenu()">
                {{ isMenuVisible ? 'Hide Menu' : 'Show Menu' }}
            </button>
        </div>
      </header>
    
      <div class="content-wrapper">
        <nav class="left-menu" id="leftMenu" #leftMenu [style.width.px]="menuWidth">
          <ng-content select="[left-menu]"></ng-content>
        </nav>
        <div class="resizer" id="resizer" #resizer (mousedown)="onResizerMouseDown($event)"></div>
        <div class="main-and-footer">
          <main class="main-content" #mainContent>
            <ng-content select="[main-content]"></ng-content>
          </main>
          @if(isBottomMenuEnabled()){
            <div class="footer-resizer" #footerResizer (mousedown)="onFooterResizerMouseDown($event)"></div>
            <footer class="footer" #footer [style.height.px]="footerHeight">
              @if(bottomMenuHeader()!==null){
                <h1>{{ bottomMenuHeader() }}</h1>
              }
              <ng-content select="[bottom-menu]"></ng-content>
            </footer>}
        </div>
      </div>
    </div>
