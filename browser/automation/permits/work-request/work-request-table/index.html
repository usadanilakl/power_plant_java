    <style>

/* Ensure no double padding or default scrolls */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden; /* no browser scroll */
}

/* main container fits everything in viewport height exactly */
.main {
  display: flex;
  flex-direction: column;
  height: 100%;         /* fills body exactly */
  overflow: hidden;     /* prevents extending beyond */
  gap: 10px;            /* optional spacing between elements */
}

/* Make table wrapper the shrinking flexible child */
#tableContainer {
  flex: 1;              /* fills remaining vertical space */
  min-height: 0;        /* required so it doesn't overflow */
  min-width: 0;         /* allows horizontal scroll */
  overflow-x: auto;     /* enable inner scrolling */
  overflow-y: auto;
  border: 1px solid #aaa;
  border-radius: 6px;
  background: #fff;
  padding-bottom: 14px;         /* adds room for scrollbar track */
  scrollbar-gutter: stable;    /* reserves space for scrollbars */
}

/* Table structure */
#tableContainer table {
  width: 100%;
  min-width: 800px;
  border-collapse: collapse;
  white-space: nowrap;
  padding-bottom: 14px;         /* adds room for scrollbar track */
  scrollbar-gutter: stable;    /* reserves space for scrollbars */
}

/* Top content styling */
#thumbnail,
a,
#responseOutput {
  max-width: 100%;
  overflow-wrap: break-word;
  flex-shrink: 0; /* these do not collapse when table grows */
}

                isSpringBoot ? '/browser/automation/permits/work-request/work-request-table/work-request-table.js' : "./work-request-table.js",
            ];

            function loadScriptSequentially(scripts, index = 0, callback) {
                if (index >= scripts.length) {
                    callback();
                    return;
                }
                var script = document.createElement('script');
                script.src = scripts[index];
                script.async = false;
                script.onload = function() {
                    // Script loaded, load next
                    loadScriptSequentially(scripts, index + 1, callback);
                };
                script.onerror = function() {
                    console.error('Error loading script:', scripts[index]);
                    loadScriptSequentially(scripts, index + 1, callback); // Continue despite errors
                };
                document.body.appendChild(script);
            }

            loadScriptSequentially(scripts, 0, function() {
                console.log('All scripts loaded; now run the rest of your code.');
                  document.getElementById('sendRequest').addEventListener('click', () => loadAndDisplay());
                  startIntervalLoop(loadAndDisplay)


                const thumbnail = document.getElementById('thumbnail');
                const overlay = document.getElementById('overlay');
                const enlargedImage = document.getElementById('enlargedImage');

                thumbnail.addEventListener('click', () => {
                    overlay.style.display = 'flex';
                });

                  
            });
        })();

        

        function hideImage() {
            overlay.style.display = 'none';

        function openLinkInBrowser(link){

                    window.javaScriptBridge.openInBrowser(link);
                    console.log('openApplication called successfully');
                } catch (error) {
                    console.error('Error calling openApplication:', error);
                }
            } else {
                console.error('JavaFX bridge not available');
            }
        }
    </script>

<script>

let currentRequests = [];

let intervalId = null;

function formatDate(dateString) {
    if (!dateString) return "";
    // Format as YYYY-MM-DD
    const date = new Date(dateString);
    return date.toISOString().split('T')[0];
}

function formatTime(timeString) {
  try{
      if (!timeString) return "";
      // Try extracting HH:mm or HH:mm:ss using regex (covers most formats)
      const match = timeString.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (match) {
        // Always output in HH:mm (leading zero if needed)
        let h = match[21].padStart(2, '0');
        let m = match[22].padStart(2, '0');
        return `${h}:${m}`;
      }
      // Fallback: Try native Date parsing
      const date = new Date(timeString);
      if (!isNaN(date.getTime())) {
        return date.toISOString().substring(11, 16);
      }
      // If both regex and date parsing fail, return the original string
      return timeString;
  }catch{
    return timeString;
  }
}

async function loadAndDisplay() {
    workRequestTable.buildTable([]);
    const data = await workRequestService.getAllRequests();
    if (data && data.responseData) {
        console.log('got data: ',data)
        workRequestTable.buildTable(data.responseData);
    }
}

function startIntervalLoop(callback) {
    const select = document.getElementById('updateInterval');

    function setupInterval() {
        // Clear any existing interval
        if (intervalId) {
        clearInterval(intervalId);
        }

        // Get selected interval in minutes and convert to milliseconds
        const minutes = parseInt(select.value, 10);
        const intervalMs = minutes * 60 * 1000;

        // Run callback immediately once
        callback();

        // Set callback to repeat on the selected interval
        intervalId = setInterval(callback, intervalMs);
    }

    // Listen for changes in the select element
    select.addEventListener('change', () => {
        setupInterval();
    });

    // Initial setup
    setupInterval();
}


</script>
