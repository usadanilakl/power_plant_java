<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson</title>
    <script>
        (function() {
            var isSpringBoot = window.location.hostname !== "" && window.location.hostname === "localhost";
            var prefix = isSpringBoot ? "browser/" : "";
            document.write('<link rel="stylesheet" href="' + prefix + 'style.css" id="mainStyle">');
            document.write('<link rel="stylesheet" href="' + prefix + 'app/dom/table/table-style.css" id="tableStyle">');
            document.write('<link rel="stylesheet" href="' + prefix + 'app/dom/image/interactive-image.css" id="interactiveImageStyle">');
            document.write('<link rel="stylesheet" href="' + prefix + 'app/dom/image/grid-image.css" id="gridImageStyle">');
            document.write('<link rel="stylesheet" href="' + prefix + 'app/dom/image/carousel-image.css" id="carouselImageStyle">');
            document.write('<link rel="stylesheet" href="' + prefix + 'app/dom/floating-window/floating-window.css" id="floatingWindowStyle">');
            document.write('<link rel="stylesheet" href="' + prefix + 'app/dom/input-fields/searchable-dropdown.css" id="searchableDropdownStyle">');
        })();
    </script>

</head>
<body>
    <div class="container">
        <header>
            <h1>Jackson Generation</h1>
            <div class="controls">
                <div id="status">Checking server status...</div>
                <button id="initUpdateButton" class="updates-available hidden" onclick="update.updateAll()">Update</button>
                <div class="toggle-buttons">
                    <button id="toggleLeft" class="toggle-button" title="Toggle Menu">
                        &#9776;
                    </button>
                    <button id="themeToggle" class="toggle-button" title="Toggle Theme">
                        &#9681;
                    </button>
                </div>
            </div>
            <div class="menu-buttons">
                <button onclick="fileTable.buildFileTable()">Files</button>
                <button onclick="equipmentTable.buildEquipmentTable()">Equipment</button>
                <button onclick="lotoPointTable.buildTable()">LotoPoints</button>
                <button onclick="heatTraceTable.buildTable()">Heat Trace</button>
                <button onclick="referenceDataTable.buildTable()">Reference Table</button>
                <button class="server-dependent" onclick="angularApi.navigateToFiles()">Edit Files</button>
                <button class="server-dependent" onclick="angularApi.navigateToLotoPoints()">LOTO Points</button>
                <button class="server-dependent" onclick="angularApi.navigateToTags()">Manage Tag Numbers</button>
                <button class="server-dependent" onclick="openRedTagControls()">Red Tag</button>
                <button class="server-dependent" onclick="stopServer()">Shut Down Server</button>
            </div>
        </header>
        <div class="content">
            <div class="left-side" id="leftSide">
                <div id="tableContainer"></div>
            </div>
            <div class="resizer" id="resizer"></div>
            <div id="main" class="right-side">
                <div id="carousel-container">
                    <div id="carousel"></div>
                </div>
                <div id="image"></div>
            </div>
        </div>
    </div>

    <script>
        let appIsLoades = false;
        (function() {
            var isSpringBoot = window.location.hostname !== "" && window.location.hostname === "localhost";
            var prefix = isSpringBoot ? "browser/" : "";

            // console.log('Loading scripts...', window.location.hostname);
    
            var scripts = [
                'properties/static-resources.js',
                'data/equipment.js',
                'data/loto-points.js',
                'data/files.js',
                'data/heat-trace.js',
                'data/reference-data.js',
                'app/server/server-status.js',
                'app/server/updates.js',
                'app/server/angular-api.js',
                'app/utils/theme-switcher.js',
                'app/utils/main-layout-resizer.js',
                'app/dom/table/table.js',
                'app/dom/floating-window/floating-window.js',
                'app/dom/input-fields/searchable-dropdown.js',
                'app/files/file-service.js',
                'app/files/file-table.js',
                'app/dom/image/interactive-image.js',
                'app/dom/image/grid-image.js',
                'app/dom/image/carousel-image.js',
                'app/dom/popup/popup.js',
                'app/dom/pdf-viewer.js',
                'app/equipment/equipment-service.js',
                'app/equipment/equipment-table.js',
                'app/loto-points/loto-point.service.js',
                'app/loto-points/loto-point-table.js',
                'app/heat-trace/heat-trace.service.js',
                'app/heat-trace/heat-trace-table.js',
                'app/loto/loto-building.service.js',
                'app/loto/loto-standard.service.js',
                'app/loto/loto-standard-table.js',
                'app/loto/loto-standard-builder.js',
                'app/reference-data/reference-data.service.js',
                'app/reference-data/reference-data-display.js',
                'app/reference-data/reference-data-table.js',
            ];
    
            scripts.forEach(function(src) {
                var script = document.createElement('script');
                script.src = prefix + src;
                script.async = false; // This ensures scripts are loaded in order
                document.body.appendChild(script);
                // console.log('Loaded script:', script);
            });
        })();
        const caruselElement = document.getElementById('carousel-container');
        function openRedTagControls() {
            window.open('red-tag-controls.html', '_blank', 'width=600,height=400');
        }
        // Prevent context menu on entire document or on your specific table element
        document.addEventListener('contextmenu', function(event) {
            // Optionally filter target elements if needed, e.g. only rows:
            // if (event.target.closest('tr.row')) {
            //     event.preventDefault();  // Block the right-click context menu
            // }

            event.preventDefault();
        });

    </script>



</body>
</html>
