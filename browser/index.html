<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app/dom/table/table-style.css">
    <link rel="stylesheet" href="app/dom/image/interactive-image.css">
    <link rel="stylesheet" href="app/dom/image/grid-image.css">
    <link rel="stylesheet" href="app/dom/image/carousel-image.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Jackson Generation</h1>
            <div class="controls">
                <div id="status">Checking server status...</div>
                <button id="initUpdateButton" class="updates-available hidden" onclick="update.updateAll()">Update</button>
                <div class="toggle-buttons">
                    <button id="toggleLeft" class="toggle-button" title="Toggle Menu">
                        &#9776;
                    </button>
                    <button id="themeToggle" class="toggle-button" title="Toggle Theme">
                        &#9681;
                    </button>
                </div>
            </div>
            <div class="menu-buttons">
                <button onclick="fileTable.buildFileTable()">Browse Files</button>
                <button onclick="equipmentTable.buildEquipmentTable()">Browse Equipment</button>
                <button class="server-dependent" onclick="angularApi.navigateToFiles()">Edit Files</button>
                <button class="server-dependent" onclick="angularApi.navigateToLotoPoints()">LOTO Points</button>
                <button class="server-dependent" onclick="angularApi.navigateToTags()">Manage Tag Numbers</button>
                <button class="server-dependent" onclick="stopServer()">Shut Down Server</button>
            </div>
        </header>
        <div class="content">
            <div class="left-side" id="leftSide">
                <div id="tableContainer"></div>
            </div>
            <div class="resizer" id="resizer"></div>
            <div id="main" class="right-side">
                <div id="carousel-container">
                    <div id="carousel"></div>
                </div>
                <div id="image"></div>
            </div>
        </div>
    </div>

    <script src="properties/static-resources.js"></script>

    <script src="data/equipment.js"></script>
    <script src="data/files.js"></script>

    <script src="app/server/server-status.js"></script>
    <script src="app/server/updates.js"></script>
    <script src="app/server/angular-api.js"></script>

    <script src="app/utils/theme-switcher.js"></script>
    <script src="app/utils/main-layout-resizer.js"></script>
    <script src="app/dom/table/table.js"></script>
    <script src="app/files/file-table.js"></script>
    <script src="app/files/file-service.js"></script>
    <script src="app/dom/image/interactive-image.js"></script>
    <script src="app/dom/image/grid-image.js"></script>
    <script src="app/dom/image/carousel-image.js"></script>
    <script src="app/equipment/equipment-service.js"></script>
    <script src="app/equipment/equipment-table.js"></script>



</body>
</html>
